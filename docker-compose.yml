services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DEPLOY_ENV: ${DEPLOY_ENV:?DEPLOY_ENV is required}
      SITE_URL: ${SITE_URL:?SITE_URL is required}
      POCKETBASE_INTERNAL_URL: http://pocketbase-internal:8090
    expose:
      - "3000"
    depends_on:
      pocketbase:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app-internal
      - dokploy-network

  pocketbase:
    build:
      context: .
      dockerfile: pocketbase/Dockerfile
      args:
        PB_VERSION: "0.39.9"
    restart: unless-stopped
    environment:
      PB_ENCRYPTION_KEY: ${PB_ENCRYPTION_KEY:?PB_ENCRYPTION_KEY is required}
      RAZORPAY_API_BASE_URL: ${RAZORPAY_API_BASE_URL:-https://api.razorpay.com}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_CHECKOUT_HOLD_SECONDS: ${RAZORPAY_CHECKOUT_HOLD_SECONDS:-600}
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-true}
      SITE_URL: ${SITE_URL:?SITE_URL is required}
      FOOTBALL_DATA_API_TOKEN: ${FOOTBALL_DATA_API_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-}
      SMTP_AUTH_METHOD: ${SMTP_AUTH_METHOD:-}
      SMTP_LOCAL_NAME: ${SMTP_LOCAL_NAME:-}
    volumes:
      - pb_data:/pb/pb_data
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      app-internal:
        aliases:
          - pocketbase-internal
      dokploy-network:

volumes:
  pb_data:

networks:
  app-internal:
    internal: true
  dokploy-network:
    external: true
