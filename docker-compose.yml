# ─────────────────────────────────────────────────────────────
#  IEEE Sahrdaya — Production Docker Compose
#  TanStack Start app + PocketBase (with pb_hooks support).
#  TLS options (pick one):
#    A) Cloudflare Tunnel — zero open ports, free TLS at edge
#    B) Minimal Caddy alongside — see commented service below
#    C) PaaS with built-in TLS (Railway, Fly.io, Render)
# ─────────────────────────────────────────────────────────────

services:
  # ─── TanStack Start App ────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ieee-sahrdaya/app:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - POCKETBASE_URL=${POCKETBASE_URL:-https://db.phloraxx.us.to}
      - PAYMENT_API_URL=${PAYMENT_API_URL:-https://pay.mulearnscet.in}
      - PAYMENT_WEBHOOK_SECRET=${PAYMENT_WEBHOOK_SECRET:?err}
      - OAUTH_COOKIE_SECRET=${OAUTH_COOKIE_SECRET:?err}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-https://ieeesahrdaya.com}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - POCKETBASE_ADMIN_TOKEN=${POCKETBASE_ADMIN_TOKEN:?err}

  # ─── OPTIONAL: Minimal Caddy for TLS termination ────────
  # Uncomment if self-hosting on a VPS and not using Cloudflare Tunnel.
  # Remove the app.ports section above when using Caddy.
  #
  # caddy:
  #   image: caddy:2-alpine
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - caddy_data:/data
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #   environment:
  #     - DOMAIN=${DOMAIN:-ieeesahrdaya.com}
  #
  # volumes:
  #   caddy_data:

  # ─── PocketBase (with pb_hooks) ─────────────────────────────
  pocketbase:
    image: adrianmusante/pocketbase:latest
    restart: always
    expose:
      - 8090
    volumes:
      - pocketbase-data:/pocketbase
      - ./pb_hooks:/pocketbase/hooks
    environment:
      - POCKETBASE_ADMIN_EMAIL=${ADMIN_EMAIL:?err}
      - POCKETBASE_ADMIN_PASSWORD=${ADMIN_PASSWORD:?err}
      - POCKETBASE_ADMIN_UPSERT=true
      - POCKETBASE_PORT_NUMBER=8090
      - POCKETBASE_HOOK_DIR=/pocketbase/hooks
      # Optional: enable settings encryption
      # - POCKETBASE_ENCRYPTION_KEY=${ENCRYPTION_KEY}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/_/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pocketbase-data:
