version: "3.9"

# ─────────────────────────────────────────────────────────────
#  IEEE Sahrdaya — Production Docker Compose
#  Cluster:  3 Next.js replicas behind Caddy (load-balanced)
#  Caching:  BuildKit mount cache for npm + Next.js builds
#  PB:       Separate container at db.phloraxx.us.to (external)
# ─────────────────────────────────────────────────────────────

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &restart-policy
  restart: unless-stopped
  logging: *default-logging

services:
  # ─── Next.js App Cluster ─────────────────────────────────
  app:
    <<: *restart-policy
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - type=registry,ref=ieee-sahrdaya/app:cache
      cache_to:
        - type=registry,ref=ieee-sahrdaya/app:cache,mode=max
    image: ieee-sahrdaya/app:latest
    environment:
      - NODE_ENV=production
      - POCKETBASE_URL=${POCKETBASE_URL:-https://db.phloraxx.us.to}
      - POCKETBASE_SUPERUSER_TOKEN=${POCKETBASE_SUPERUSER_TOKEN:?err}
      - PAYMENT_API_URL=${PAYMENT_API_URL:-https://pay.mulearnscet.in}
      - PAYMENT_WEBHOOK_SECRET=${PAYMENT_WEBHOOK_SECRET:?err}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://ieeesahrdaya.com}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      rollback_config:
        parallelism: 1
        order: stop-first

  # ─── Caddy Reverse Proxy ─────────────────────────────────
  caddy:
    <<: *restart-policy
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      - DOMAIN=${DOMAIN:-ieeesahrdaya.com}
      - APP_URL=${NEXT_PUBLIC_APP_URL:-https://ieeesahrdaya.com}
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
