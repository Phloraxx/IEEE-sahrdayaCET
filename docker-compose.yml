services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DEPLOY_ENV: ${DEPLOY_ENV:?DEPLOY_ENV is required}
      SITE_URL: ${SITE_URL:?SITE_URL is required}
      # SQLite app-server storage (bind-mounted from the host).
      SQLITE_PATH: /app/data/portal.db
      UPLOADS_DIR: /app/data/uploads
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      APP_URL: ${APP_URL:?APP_URL is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-__Host-ieee_session}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      # Payments (paygate) and mail are handled by the app server, not
      # PocketBase hooks.
      PAYGATE_URL: ${PAYGATE_URL:-}
      PAYGATE_API_KEY: ${PAYGATE_API_KEY:-}
      PAYGATE_WEBHOOK_SECRET: ${PAYGATE_WEBHOOK_SECRET:-}
      PAYGATE_REGISTRATION_GRACE_SECONDS: ${PAYGATE_REGISTRATION_GRACE_SECONDS:-600}
      PAYGATE_WEBHOOK_TOLERANCE_SECONDS: ${PAYGATE_WEBHOOK_TOLERANCE_SECONDS:-300}
      PAYGATE_CLIENT_NAMESPACE: ${PAYGATE_CLIENT_NAMESPACE:-}
      MAIL_DELIVERY_MODE: ${MAIL_DELIVERY_MODE:-}
      MAIL_ALLOWLIST: ${MAIL_ALLOWLIST:-}
      MAIL_REDIRECT_TO: ${MAIL_REDIRECT_TO:-}
      # Gmail / Google Workspace submission. Port 587 negotiates STARTTLS, so
      # SMTP_TLS stays false; 465 would mean implicit TLS.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-false}
      CERTIFICATE_RENDER_CAPABILITY_KEY: ${CERTIFICATE_RENDER_CAPABILITY_KEY:?CERTIFICATE_RENDER_CAPABILITY_KEY is required}
    volumes:
      - ${SQLITE_DATA_DIR:?SQLITE_DATA_DIR is required}:/app/data
      - ${UPLOADS_HOST_DIR:?UPLOADS_HOST_DIR is required}:/app/data/uploads
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app-internal
      - dokploy-network
      - default
    # Traefik routes this host to the app server. Both values are required per
    # environment (see .env.example) so a deploy fails fast instead of silently
    # routing production traffic to a staging host or not routing at all.
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.${ROUTER_KEY:?ROUTER_KEY is required}.rule=Host(`${SITE_HOST:?SITE_HOST is required}`)
      - traefik.http.routers.${ROUTER_KEY:?ROUTER_KEY is required}.entrypoints=web
      - traefik.http.services.${ROUTER_KEY:?ROUTER_KEY is required}.loadbalancer.server.port=3000
      - traefik.http.routers.${ROUTER_KEY:?ROUTER_KEY is required}.service=${ROUTER_KEY:?ROUTER_KEY is required}

  # PocketBase is kept running as a rollback target. The web service no
  # longer depends on it after the SQLite cutover. Do not remove it until
  # the SQLite deployment is confirmed stable. It carries no Traefik labels:
  # the app server owns the host, including /api, so a router here would
  # compete with the web router for the same paths.
  pocketbase:
    build:
      context: .
      dockerfile: pocketbase/Dockerfile
      args:
        PB_VERSION: "0.39.9"
    restart: unless-stopped
    environment:
      DEPLOY_ENV: ${DEPLOY_ENV:?DEPLOY_ENV is required}
      PB_ENCRYPTION_KEY: ${PB_ENCRYPTION_KEY:?PB_ENCRYPTION_KEY is required}
      PAYGATE_URL: ${PAYGATE_URL:-}
      PAYGATE_API_KEY: ${PAYGATE_API_KEY:-}
      PAYGATE_WEBHOOK_SECRET: ${PAYGATE_WEBHOOK_SECRET:-}
      PAYGATE_REGISTRATION_GRACE_SECONDS: ${PAYGATE_REGISTRATION_GRACE_SECONDS:-600}
      PAYGATE_WEBHOOK_TOLERANCE_SECONDS: ${PAYGATE_WEBHOOK_TOLERANCE_SECONDS:-300}
      PAYGATE_CLIENT_NAMESPACE: ${PAYGATE_CLIENT_NAMESPACE:-}
      SITE_URL: ${SITE_URL:?SITE_URL is required}
      FOOTBALL_DATA_API_TOKEN: ${FOOTBALL_DATA_API_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-}
      SMTP_AUTH_METHOD: ${SMTP_AUTH_METHOD:-}
      SMTP_LOCAL_NAME: ${SMTP_LOCAL_NAME:-}
      MAIL_DELIVERY_MODE: ${MAIL_DELIVERY_MODE:-}
      MAIL_ALLOWLIST: ${MAIL_ALLOWLIST:-}
      MAIL_REDIRECT_TO: ${MAIL_REDIRECT_TO:-}
      CERTIFICATE_RENDER_CAPABILITY_KEY: ${CERTIFICATE_RENDER_CAPABILITY_KEY:?CERTIFICATE_RENDER_CAPABILITY_KEY is required}
    volumes:
      - pb_data:/pb/pb_data
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      app-internal:
        aliases:
          - pocketbase-internal
      dokploy-network:

volumes:
  pb_data:

networks:
  app-internal:
    internal: true
  dokploy-network:
    external: true
