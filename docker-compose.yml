# ─────────────────────────────────────────────────────────────
#  IEEE Sahrdaya — Production Docker Compose
#  Single Next.js instance (no load balancer, no Caddy).
#  TLS options (pick one):
#    A) Cloudflare Tunnel — zero open ports, free TLS at edge
#    B) Minimal Caddy alongside — see commented service below
#    C) PaaS with built-in TLS (Railway, Fly.io, Render)
#  PB: Separate container at db.phloraxx.us.to (external)
# ─────────────────────────────────────────────────────────────

services:
  # ─── Next.js App ─────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ieee-sahrdaya/app:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - POCKETBASE_URL=${POCKETBASE_URL:-https://db.phloraxx.us.to}
      - POCKETBASE_SUPERUSER_TOKEN=${POCKETBASE_SUPERUSER_TOKEN:?err}
      - PAYMENT_API_URL=${PAYMENT_API_URL:-https://pay.mulearnscet.in}
      - PAYMENT_WEBHOOK_SECRET=${PAYMENT_WEBHOOK_SECRET:?err}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://ieeesahrdaya.com}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  # ─── OPTIONAL: Minimal Caddy for TLS termination ────────
  # Uncomment if self-hosting on a VPS and not using Cloudflare Tunnel.
  # Remove the app.ports section above when using Caddy.
  #
  # caddy:
  #   image: caddy:2-alpine
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - caddy_data:/data
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #   environment:
  #     - DOMAIN=${DOMAIN:-ieeesahrdaya.com}
  #
  # volumes:
  #   caddy_data:
