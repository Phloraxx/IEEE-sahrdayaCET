<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IEEE Sahrdaya SB — Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23c14a3a'/%3E%3Ctext x='16' y='22' font-size='16' font-weight='bold' text-anchor='middle' fill='white' font-family='sans-serif'%3ESB%3C/text%3E%3C/svg%3E">
<style>
/* ═══════════════════════════════════════════════════════════════
   EDITORIAL-MONOCLE DESIGN TOKENS
   ═══════════════════════════════════════════════════════════════ */
:root {
  --paper: #f7f5f0;
  --paper-alt: #f0ede7;
  --ink: #1a1a1a;
  --ink-soft: #6b655a;
  --ink-muted: #a09a8e;
  --ink-border: #ddd8d0;
  --ink-border-light: #e8e4dc;
  --accent: #c14a3a;
  --accent-hover: #a83a2c;
  --accent-light: #f5e6e3;
  --success: #2e7d5e;
  --success-light: #e8f3ee;
  --warning: #b8860b;
  --warning-light: #f8f0e0;
  --danger: #b33a2a;
  --danger-light: #f5e3e0;

  --font-serif: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, serif;
  --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "SF Mono", "Cascadia Code", "JetBrains Mono", Consolas, monospace;

  --sidebar-w: 220px;
  --sidebar-w-collapsed: 56px;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 18px;
}

/* ═══════════════════════════════════════════════════════════════
   RESET + BASE
   ═══════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; -webkit-font-smoothing: antialiased; }
body {
  font-family: var(--font-sans);
  color: var(--ink);
  background: var(--paper);
  line-height: 1.5;
  display: flex;
  min-height: 100vh;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea, select { font: inherit; color: inherit; }
table { border-collapse: collapse; width: 100%; }
img { max-width: 100%; display: block; }
svg { flex-shrink: 0; }
kbd {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  padding: 0.1em 0.4em;
  border: 1px solid var(--ink-border);
  border-radius: 4px;
  background: var(--paper-alt);
}

/* ═══════════════════════════════════════════════════════════════
   SIDEBAR
   ═══════════════════════════════════════════════════════════════ */
.sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: var(--ink);
  color: #ccc;
  display: flex;
  flex-direction: column;
  border-right: 1px solid #2a2a2a;
  transition: width 0.2s, min-width 0.2s;
  overflow: hidden;
  position: sticky;
  top: 0;
  height: 100vh;
}
.sidebar.collapsed {
  width: var(--sidebar-w-collapsed);
  min-width: var(--sidebar-w-collapsed);
}
.sidebar-header {
  padding: 1rem 1rem 0.75rem;
  border-bottom: 1px solid #2a2a2a;
}
.sidebar-brand {
  display: flex;
  align-items: center;
  gap: 0.625rem;
  white-space: nowrap;
  overflow: hidden;
}
.sidebar-logo {
  width: 28px; height: 28px;
  background: var(--accent);
  color: #fff;
  font-size: 0.7rem;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  border-radius: var(--radius-sm);
}
.sidebar-brand-text {
  display: flex; flex-direction: column;
}
.sidebar-brand-name {
  font-family: var(--font-serif);
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: #e8e4dc;
  text-transform: uppercase;
}
.sidebar-brand-sub {
  font-size: 0.6rem;
  color: #777;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.sidebar-nav {
  flex: 1; overflow-y: auto;
  padding: 0.75rem 0;
}
.sidebar-section {
  padding: 0 0.625rem;
  margin-bottom: 0.25rem;
}
.sidebar-section-label {
  font-size: 0.55rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: #555;
  padding: 0.75rem 0.625rem 0.375rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 600;
}
.sidebar-item {
  display: flex;
  align-items: center;
  gap: 0.625rem;
  padding: 0.5rem 0.625rem;
  border-radius: var(--radius-md);
  font-size: 0.8rem;
  color: #999;
  white-space: nowrap;
  overflow: hidden;
  transition: color 0.15s, background 0.15s;
  cursor: pointer;
  position: relative;
}
.sidebar-item:hover { color: #e8e4dc; background: #2a2a2a; }
.sidebar-item.active {
  color: #e8e4dc;
  background: rgba(193,74,58,0.15);
}
.sidebar-item svg {
  width: 16px; height: 16px;
  flex-shrink: 0;
}
.sidebar-item span { overflow: hidden; text-overflow: ellipsis; }
.sidebar.collapsed .sidebar-item span,
.sidebar.collapsed .sidebar-brand-text,
.sidebar.collapsed .sidebar-section-label,
.sidebar.collapsed .sidebar-footer-text,
.sidebar.collapsed .sidebar-badge,
.sidebar.collapsed .sidebar-toggle-text { display: none; }
.sidebar.collapsed .sidebar-item { justify-content: center; padding: 0.5rem; }
.sidebar.collapsed .sidebar-header { padding: 0.75rem 0.5rem; display: flex; justify-content: center; }
.sidebar.collapsed .sidebar-logo { margin: 0; }
.sidebar.collapsed .sidebar-section { padding: 0 0.25rem; }
.sidebar.collapsed .sidebar-section-label { display: none; }

.sidebar-footer {
  padding: 0.625rem;
  border-top: 1px solid #2a2a2a;
}
.sidebar-user {
  display: flex; align-items: center; gap: 0.625rem;
  padding: 0.375rem 0.5rem;
  cursor: pointer;
  border-radius: var(--radius-md);
  transition: background 0.15s;
}
.sidebar-user:hover { background: #2a2a2a; }
.sidebar-avatar {
  width: 28px; height: 28px;
  background: #333;
  color: #999;
  font-size: 0.6rem;
  font-weight: 600;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  border: 1px solid #444;
  border-radius: var(--radius-sm);
}
.sidebar-user-info {
  overflow: hidden;
  white-space: nowrap;
}
.sidebar-user-name {
  font-size: 0.75rem;
  color: #ccc;
  overflow: hidden; text-overflow: ellipsis;
}
.sidebar-user-role {
  font-size: 0.6rem;
  color: #666;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.sidebar-badge {
  font-size: 0.55rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 0.15em 0.5em;
  border: 1px solid var(--accent);
  color: var(--accent);
  display: inline-block;
}
.sidebar-toggle {
  position: absolute;
  bottom: 0.5rem;
  right: -0.75rem;
  width: 24px; height: 24px;
  background: var(--paper);
  border: 1px solid var(--ink-border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  z-index: 10;
  color: var(--ink-soft);
  font-size: 0.7rem;
  border-radius: 50%;
}
.sidebar-toggle:hover { background: var(--ink-border-light); }

/* ═══════════════════════════════════════════════════════════════
   MAIN LAYOUT
   ═══════════════════════════════════════════════════════════════ */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.topbar {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 0.75rem 1.5rem;
  border-bottom: 1px solid var(--ink-border-light);
  background: var(--paper);
  position: sticky;
  top: 0;
  z-index: 50;
}
.topbar-breadcrumb {
  display: flex;
  align-items: center;
  gap: 0.375rem;
  font-size: 0.7rem;
  letter-spacing: 0.03em;
  color: var(--ink-muted);
  font-family: var(--font-mono);
  text-transform: uppercase;
}
.topbar-breadcrumb span.accent { color: var(--accent); }
.topbar-shortcuts {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.65rem;
  color: var(--ink-muted);
}
.content {
  flex: 1;
  padding: 2.5rem 2.5rem 4rem;
  max-width: 1200px;
}

/* ═══════════════════════════════════════════════════════════════
   TYPOGRAPHY
   ═══════════════════════════════════════════════════════════════ */
h1, h2, h3, h4, h5 {
  font-family: var(--font-serif);
  font-weight: 400;
  line-height: 1.3;
  color: var(--ink);
}
.page-title {
  font-size: 1.6rem;
  letter-spacing: -0.01em;
  margin-bottom: 0.25rem;
}
.page-subtitle {
  font-size: 0.8rem;
  color: var(--ink-soft);
  font-family: var(--font-sans);
}
.label {
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-muted);
  font-family: var(--font-sans);
  font-weight: 600;
}
.value-large {
  font-family: var(--font-serif);
  font-size: 2rem;
  line-height: 1.1;
  letter-spacing: -0.02em;
}
.text-mono { font-family: var(--font-mono); font-size: 0.8rem; }
.text-small { font-size: 0.75rem; }
.text-xs { font-size: 0.65rem; }
.text-soft { color: var(--ink-soft); }
.text-muted { color: var(--ink-muted); }
.text-accent { color: var(--accent); }
.text-success { color: var(--success); }

/* ═══════════════════════════════════════════════════════════════
   COMPONENTS
   ═══════════════════════════════════════════════════════════════ */

/* Card */
.card {
  border: 1px solid var(--ink-border-light);
  background: #fff;
  border-radius: var(--radius-lg);
}
.card-header {
  padding: 1.5rem 1.5rem 0.875rem;
}
.card-header:first-child { border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
.card-title {
  font-family: var(--font-serif);
  font-size: 1rem;
  font-weight: 400;
}
.card-subtitle {
  font-size: 0.75rem;
  color: var(--ink-soft);
  margin-top: 0.15rem;
}
.card-body { padding: 1rem 1.75rem 1.75rem; }
.card-body.inset { padding: 1.75rem; }
.card-footer {
  padding: 1rem 1.75rem;
  border-top: 1px solid var(--ink-border-light);
  font-size: 0.75rem;
  color: var(--ink-soft);
}

/* Grid helper */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 2.5rem; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2.5rem; }
.grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 2.5rem; }

/* Stat card */
.stat-card {
  border: 1px solid var(--ink-border-light);
  background: #fff;
  padding: 1.75rem;
  border-radius: var(--radius-lg);
}
.stat-card-label {
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-muted);
  font-weight: 600;
  margin-bottom: 0.375rem;
}
.stat-card-value {
  font-family: var(--font-serif);
  font-size: 1.75rem;
  line-height: 1.1;
}
.stat-card-desc {
  font-size: 0.7rem;
  color: var(--ink-soft);
  margin-top: 0.25rem;
}

/* Table */
.table-wrap { overflow-x: auto; }
table.data {
  width: 100%;
  font-size: 0.8rem;
}
table.data th {
  text-align: left;
  padding: 1rem 1.25rem;
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-muted);
  font-weight: 600;
  border-bottom: 1px solid var(--ink-border);
  background: #fcfbf9;
}
table.data td {
  padding: 1rem 1.25rem;
  border-bottom: 1px solid var(--ink-border-light);
  vertical-align: middle;
}
table.data tr:last-child td { border-bottom: none; }
table.data tr:hover td { background: #faf8f5; }
table.data .row-active td { background: var(--accent-light); }

/* Badge */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  padding: 0.1em 0.5em;
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 600;
  border: 1px solid var(--ink-border);
  background: transparent;
  color: var(--ink-soft);
  border-radius: 4px;
}
.badge-accent { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
.badge-success { border-color: var(--success); color: var(--success); background: var(--success-light); }
.badge-warning { border-color: var(--warning); color: var(--warning); background: var(--warning-light); }
.badge-danger { border-color: var(--danger); color: var(--danger); background: var(--danger-light); }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.375rem;
  padding: 0.45rem 0.9rem;
  font-size: 0.75rem;
  font-family: var(--font-sans);
  font-weight: 500;
  border: 1px solid var(--ink-border);
  background: transparent;
  color: var(--ink);
  transition: background 0.15s, border-color 0.15s, color 0.15s;
  white-space: nowrap;
  border-radius: var(--radius-sm);
}
.btn:hover { background: var(--paper-alt); border-color: var(--ink-border); }
.btn-primary {
  background: var(--ink);
  color: #fff;
  border-color: var(--ink);
}
.btn-primary:hover { background: #333; }
.btn-accent {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.btn-accent:hover { background: var(--accent-hover); }
.btn-ghost { border-color: transparent; }
.btn-ghost:hover { background: var(--paper-alt); }
.btn-sm { padding: 0.3rem 0.6rem; font-size: 0.7rem; }
.btn-xs { padding: 0.15rem 0.4rem; font-size: 0.6rem; }
.btn-icon {
  width: 32px; height: 32px; padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
}
.btn-icon svg { width: 16px; height: 16px; }

/* Inputs */
.input {
  display: block;
  width: 100%;
  padding: 0.5rem 0.75rem;
  font-size: 0.8rem;
  border: 1px solid var(--ink-border);
  background: #fff;
  transition: border-color 0.15s;
  outline: none;
  border-radius: var(--radius-sm);
}
.input:focus { border-color: var(--ink); }
.input-sm { padding: 0.35rem 0.6rem; font-size: 0.75rem; }
select.input { appearance: auto; }
textarea.input { resize: vertical; min-height: 80px; }
.input-group {
  display: flex;
  align-items: center;
  gap: 0.375rem;
  padding: 0.35rem 0.75rem;
  border: 1px solid var(--ink-border);
  background: #fff;
  transition: border-color 0.15s;
  border-radius: var(--radius-sm);
}
.input-group:focus-within { border-color: var(--ink); }
.input-group input {
  flex: 1; border: none; outline: none; background: none;
  font-size: 0.8rem;
}
.input-group svg { width: 14px; height: 14px; color: var(--ink-muted); }

/* Filter bar */
.filter-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.75rem;
  padding: 1.25rem 1.75rem;
  border-bottom: 1px solid var(--ink-border-light);
  background: #fcfbf9;
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
}

/* Tabs */
.tabs {
  border-bottom: 1px solid var(--ink-border-light);
  display: flex;
  gap: 0;
  margin-bottom: 2rem;
}
.tab {
  padding: 0.875rem 1.75rem;
  font-size: 0.8rem;
  color: var(--ink-soft);
  border-bottom: 2px solid transparent;
  transition: color 0.15s, border-color 0.15s;
  cursor: pointer;
  font-family: var(--font-sans);
}
.tab:hover { color: var(--ink); }
.tab.active {
  color: var(--ink);
  border-bottom-color: var(--ink);
}
.tab-content { display: none; }
.tab-content.active { display: block; }

/* Separator */
.sep { border: none; border-top: 1px solid var(--ink-border-light); margin: 2.5rem 0; }

/* Spacing */
.space-y { display: flex; flex-direction: column; gap: 2.5rem; }
.space-y-sm { gap: 1rem; }
.flex { display: flex; }
.flex-wrap { flex-wrap: wrap; }
.items-center { align-items: center; }
.items-start { align-items: flex-start; }
.justify-between { justify-content: space-between; }
.justify-end { justify-content: flex-end; }
.gap-1 { gap: 0.5rem; }
.gap-2 { gap: 0.75rem; }
.gap-3 { gap: 1.25rem; }
.gap-4 { gap: 1.5rem; }
.mt-1 { margin-top: 0.5rem; }
.mt-2 { margin-top: 1rem; }
.mt-3 { margin-top: 1.5rem; }
.mt-4 { margin-top: 2.5rem; }
.mb-1 { margin-bottom: 0.5rem; }
.mb-2 { margin-bottom: 1rem; }
.mb-3 { margin-bottom: 1.5rem; }
.ml-auto { margin-left: auto; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.w-full { width: 100%; }

/* Pagination */
.pagination {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 1rem 1.5rem;
  border-top: 1px solid var(--ink-border-light);
  font-size: 0.75rem;
  color: var(--ink-soft);
}
.page-btn {
  padding: 0.2rem 0.5rem;
  font-size: 0.7rem;
  border: 1px solid var(--ink-border);
  transition: background 0.15s;
  background: #fff;
  border-radius: var(--radius-sm);
}
.page-btn:hover { background: var(--paper-alt); }
.page-btn.active { background: var(--ink); color: #fff; border-color: var(--ink); }
.page-btn:disabled { opacity: 0.3; cursor: default; }

/* Avatar */
.avatar {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.65rem;
  font-weight: 600;
  border: 1px solid var(--ink-border);
  background: var(--paper-alt);
  color: var(--ink-soft);
  flex-shrink: 0;
  border-radius: var(--radius-sm);
}

/* Progress bar */
.progress {
  height: 5px;
  background: var(--ink-border-light);
  overflow: hidden;
  border-radius: 999px;
}
.progress-fill { border-radius: 999px; }
.progress-fill {
  height: 100%;
  background: var(--accent);
  transition: width 0.5s;
}

/* Skeleton */
.skeleton {
  background: var(--ink-border-light);
  animation: shimmer 1.5s infinite;
  background-size: 200% 100%;
  background-image: linear-gradient(90deg, var(--ink-border-light) 0%, #f0ede7 50%, var(--ink-border-light) 100%);
}
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* Hero event card */
.hero-event {
  border: 1px solid var(--ink-border-light);
  background: #fff;
  padding: 2rem;
  position: relative;
  overflow: hidden;
  border-radius: var(--radius-lg);
}
.hero-event::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 3px;
  background: var(--accent);
}

/* Quick actions row */
.quick-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
}

/* Check-in result */
.result-box {
  padding: 1.5rem;
  border: 1px solid var(--ink-border-light);
  margin-top: 1.5rem;
  border-radius: var(--radius-md);
}
.result-box.success { border-color: var(--success); background: var(--success-light); }
.result-box.error { border-color: var(--danger); background: var(--danger-light); }

/* Form layout */
.form-grid {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 2rem;
}
.form-section {
  border: 1px solid var(--ink-border-light);
  background: #fff;
  padding: 1.75rem;
  border-radius: var(--radius-lg);
}
.form-section-title {
  font-family: var(--font-serif);
  font-size: 0.9rem;
  margin-bottom: 1.5rem;
  padding-bottom: 0.75rem;
  border-bottom: 1px solid var(--ink-border-light);
}
.form-row { margin-bottom: 1.5rem; }
.form-label {
  display: block;
  font-size: 0.7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink-soft);
  margin-bottom: 0.375rem;
}
.form-label .required { color: var(--accent); }

/* Overlay for mobile sidebar */
.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 99;
}
.sidebar-overlay.open { display: block; }

/* Responsive */
@media (max-width: 900px) {
  .grid-4 { grid-template-columns: 1fr 1fr; }
  .hidden-lg { display: none !important; }
}
@media (max-width: 768px) {
  .sidebar {
    position: fixed;
    z-index: 100;
    width: var(--sidebar-w);
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    border-right: 1px solid #2a2a2a;
  }
  .sidebar.open { transform: translateX(0); }

// ─── Navigation ──────────────────────────────────────────

  currentPage = page;
  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
  const item = document.querySelector(`.sidebar-item[data-page="${page}"]`);
  if (item) item.classList.add('active');
  document.getElementById('breadcrumb-page').textContent = page;
  renderPage(page);
  return false;
}

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  if (window.innerWidth <= 768) {
    sidebar.classList.toggle('open');
    overlay.classList.toggle('open');
  } else {
    sidebar.classList.toggle('collapsed');
  }
}
function closeSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  sidebar.classList.remove('open');
  overlay.classList.remove('open');
}

// ─── Render Engine ───────────────────────────────────────
function renderPage(page) {
  const container = document.getElementById('main-content');
  container.innerHTML = `<div class="fade-in">${PAGES[page]()}</div>`;
  container.querySelectorAll('.tab').forEach(el => {
    el.addEventListener('click', function() {
      const parent = this.closest('.tabs');
      parent.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      this.classList.add('active');
      parent.parentElement.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      const target = document.getElementById(this.dataset.tab);
      if (target) target.classList.add('active');
    });
  });
}

// ─── Simulate check-in ──────────────────────────────────
function simulateCheckin() {
  const input = document.getElementById('ticket-input');
  const result = document.getElementById('checkin-result');
  const val = input ? input.value.trim() : '';
  if (!val) {
    result.innerHTML = '<div class="result-box error"><strong style="color:var(--danger)">✕</strong> Please enter a ticket ID.</div>';
    return;
  }
  const found = MOCK.registrations.find(r => r.ticketId.toLowerCase() === val.toLowerCase());
  if (found) {
    result.innerHTML = `<div class="result-box success">
      <div class="flex items-start gap-2">
        <strong style="color:var(--success)">✓</strong>
        <div><strong style="color:var(--success)">Checked in successfully!</strong><br><span class="text-small text-soft">${found.name}</span></div>
      </div>
    </div>`;
    if (input) input.value = '';
  } else {
    result.innerHTML = '<div class="result-box error"><div class="flex items-start gap-2"><strong style="color:var(--danger)">✕</strong><div><strong style="color:var(--danger)">Check-in failed</strong><br><span class="text-small text-soft">Invalid or duplicate ticket ID.</span></div></div></div>';
  }
}

// ─── Init ────────────────────────────────────────────────
renderPage('overview');
</script>
</body>
</html>
