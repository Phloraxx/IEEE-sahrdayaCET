name: Temporary typed search navigation patch

on:
  push:
    branches:
      - fix/events-public-lifecycle

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[typed-search-final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/events-public-lifecycle
          fetch-depth: 0
      - name: Fix typed search object
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('src/routes/admin.events.index.tsx')
          text = path.read_text()
          old = 'navigate({ to: "/admin/events/new", search: {} })'
          new = 'navigate({ to: "/admin/events/new", search: { society: undefined } })'
          if old not in text:
              raise SystemExit('Typed search navigation pattern not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin.events.index.tsx
          git commit -m "fix(events): provide optional society search value [typed-search-final]"
          git push origin HEAD:fix/events-public-lifecycle
