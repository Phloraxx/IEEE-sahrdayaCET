name: Temporary TypeScript PR diagnostics

on:
  pull_request:
    branches:
      - dev

jobs:
  tsc:
    runs-on: ubuntu-latest
    steps:
      - name: Run TypeScript compiler with minimal log noise
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/archive/${HEAD_SHA}.tar.gz" -o source.tar.gz
          mkdir source
          tar -xzf source.tar.gz --strip-components=1 -C source
          cd source
          npm install --silent --no-audit --no-fund >/dev/null 2>&1
          npx tsc --noEmit
