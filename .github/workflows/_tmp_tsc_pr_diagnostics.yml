name: Temporary TypeScript PR diagnostics

on:
  pull_request:
    branches:
      - dev

jobs:
  tsc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - run: npm install --silent --no-audit --no-fund >/dev/null 2>&1
      - run: npx tsc --noEmit
