name: Temporary event navigation patch

on:
  push:
    branches:
      - fix/events-public-lifecycle

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[event-nav-search-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/events-public-lifecycle
          fetch-depth: 0
      - name: Add required empty search object
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('src/routes/admin.events.index.tsx')
          text = path.read_text()
          old = 'onClick={() => navigate({ to: "/admin/events/new" })}'
          new = 'onClick={() => navigate({ to: "/admin/events/new", search: {} })}'
          if old not in text:
              raise SystemExit('Navigation pattern not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin.events.index.tsx
          git commit -m "fix(events): satisfy typed search navigation [event-nav-search-patched]"
          git push origin HEAD:fix/events-public-lifecycle
