name: Temporary society event pagination patch

on:
  push:
    branches:
      - fix/events-public-lifecycle

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[society-events-unbounded]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/events-public-lifecycle
          fetch-depth: 0

      - name: Remove society event list cap
        run: |
          python <<'PY'
          from pathlib import Path

          for path in [Path('src/routes/societies_.$slug.tsx'), Path('src/routes/societies_.wie.tsx')]:
              text = path.read_text()
              old = '''      pb
        .collection("events")
        .getList(1, 100, {
          filter: `society = '${society.id}'`,
          sort: "-date",
        })
        .then((res) => res.items)
        .catch(() => []),'''
              new = '''      pb
        .collection("events")
        .getFullList({
          batch: 200,
          filter: `society = '${society.id}'`,
          sort: "-date",
        })
        .catch(() => []),'''
              if old not in text:
                  raise SystemExit(f'Event query pattern not found in {path}')
              path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/routes/societies_.$slug.tsx' src/routes/societies_.wie.tsx
          git commit -m "fix(events): remove society event history cap [society-events-unbounded]"
          git push origin HEAD:fix/events-public-lifecycle
