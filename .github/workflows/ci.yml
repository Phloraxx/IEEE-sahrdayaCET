name: CI

on:
  push:
    branches: [main, dev, rewrite/react-router-pocketbase]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.2.9

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: Production build
        run: bun run build

  clean-room-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Build PocketBase image
        run: docker build -t ieee-pocketbase-ci -f pocketbase/Dockerfile .
      - name: Start fresh PocketBase
        run: |
          docker run -d --name ieee-pocketbase-ci \
            -p 127.0.0.1:8090:8090 \
            -e PB_ENCRYPTION_KEY='0123456789abcdef0123456789abcdef' \
            ieee-pocketbase-ci
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:8090/api/health >/dev/null && exit 0
            sleep 1
          done
          docker logs ieee-pocketbase-ci
          exit 1
      - name: Create CI superuser
        run: |
          docker exec ieee-pocketbase-ci ./pocketbase superuser upsert \
            ci-super@example.test 'CI-PocketBase-Smoke-2026!' --encryptionEnv=PB_ENCRYPTION_KEY
      - name: Exercise backend invariants
        env:
          PB_BASE_URL: http://127.0.0.1:8090
          PB_SUPERUSER_EMAIL: ci-super@example.test
          PB_SUPERUSER_PASSWORD: CI-PocketBase-Smoke-2026!
        run: python3 tests/backend/pocketbase_smoke.py
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Browser E2E
        env:
          CI: "true"
          DEPLOY_ENV: production
          SITE_URL: https://ieeesahrdaya.com
          POCKETBASE_INTERNAL_URL: http://127.0.0.1:8090
        run: bun run test:e2e
      - name: Backend logs on failure
        if: failure()
        run: docker logs ieee-pocketbase-ci || true

  container-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        include:
          - name: web
            dockerfile: Dockerfile
          - name: pocketbase
            dockerfile: pocketbase/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ieee-sahrdaya/${{ matrix.name }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
