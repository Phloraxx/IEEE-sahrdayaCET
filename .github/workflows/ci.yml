name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.2.9

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install certificate renderer fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: Production build
        run: bun run build

  clean-room-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Build PocketBase image
        run: docker build -t ieee-pocketbase-ci -f pocketbase/Dockerfile .
      - name: Start fake Razorpay API
        env:
          RAZORPAY_KEY_ID: rzp_test_ieee
          RAZORPAY_KEY_SECRET: test_secret_ieee_2026
          RAZORPAY_FAKE_PORT: "18080"
        run: |
          python3 tests/backend/fake_razorpay.py > /tmp/fake-razorpay.log 2>&1 &
          echo $! > /tmp/fake-razorpay.pid
          for i in {1..20}; do
            curl -fsS -u 'rzp_test_ieee:test_secret_ieee_2026' 'http://127.0.0.1:18080/v1/orders?count=1' >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/fake-razorpay.log
          exit 1
      - name: Start fresh PocketBase
        run: |
          docker run -d --name ieee-pocketbase-ci \
            --add-host=host.docker.internal:host-gateway \
            -p 127.0.0.1:8090:8090 \
            -e PB_ENCRYPTION_KEY='0123456789abcdef0123456789abcdef' \
            -e RAZORPAY_API_BASE_URL='http://host.docker.internal:18080' \
            -e RAZORPAY_KEY_ID='rzp_test_ieee' \
            -e RAZORPAY_KEY_SECRET='test_secret_ieee_2026' \
            -e RAZORPAY_WEBHOOK_SECRET='test_webhook_ieee_2026' \
            -e RAZORPAY_CHECKOUT_HOLD_SECONDS='600' \
            -e PAYMENTS_ENABLED='true' \
            -e PAYGATE_URL='http://host.docker.internal:18081' \
            -e PAYGATE_API_KEY='CI-PayGate-Api-Key-2026!!!!' \
            -e PAYGATE_WEBHOOK_SECRET='CI-PayGate-Webhook-2026!!!!' \
            -e PAYGATE_REGISTRATION_GRACE_SECONDS='600' \
            -e CERTIFICATE_RENDER_CAPABILITY_KEY='CI-Certificate-Render-Capability-2026-Only-Test' \
            ieee-pocketbase-ci
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:8090/api/health >/dev/null && exit 0
            sleep 1
          done
          docker logs ieee-pocketbase-ci
          exit 1
      - name: Create CI superuser
        run: |
          docker exec ieee-pocketbase-ci ./pocketbase superuser upsert \
            ci-super@example.test 'CI-PocketBase-Smoke-2026!' --encryptionEnv=PB_ENCRYPTION_KEY
      - name: Exercise backend invariants
        env:
          PB_BASE_URL: http://127.0.0.1:8090
          PB_SUPERUSER_EMAIL: ci-super@example.test
          PB_SUPERUSER_PASSWORD: CI-PocketBase-Smoke-2026!
        run: python3 tests/backend/pocketbase_smoke.py
      - name: Exercise certificate template lifecycle
        env:
          PB_BASE_URL: http://127.0.0.1:8090
          PB_SUPERUSER_EMAIL: ci-super@example.test
          PB_SUPERUSER_PASSWORD: CI-PocketBase-Smoke-2026!
        run: python3 tests/backend/certificate_template_smoke.py
      - name: Exercise certificate issuance lifecycle
        env:
          PB_BASE_URL: http://127.0.0.1:8090
          PB_SUPERUSER_EMAIL: ci-super@example.test
          PB_SUPERUSER_PASSWORD: CI-PocketBase-Smoke-2026!
        run: python3 tests/backend/certificate_issuance_smoke.py
      - name: Exercise 200-recipient certificate scale
        env:
          PB_BASE_URL: http://127.0.0.1:8090
          PB_SUPERUSER_EMAIL: ci-super@example.test
          PB_SUPERUSER_PASSWORD: CI-PocketBase-Smoke-2026!
        run: python3 tests/backend/certificate_bulk_smoke.py
      - name: Exercise public certificate verification
        env:
          PB_BASE_URL: http://127.0.0.1:8090
          PB_SUPERUSER_EMAIL: ci-super@example.test
          PB_SUPERUSER_PASSWORD: CI-PocketBase-Smoke-2026!
          CERTIFICATE_RENDER_CAPABILITY_KEY: CI-Certificate-Render-Capability-2026-Only-Test
        run: python3 tests/backend/certificate_public_smoke.py
      - name: Exercise certificate delivery lifecycle
        env:
          PB_BASE_URL: http://127.0.0.1:8090
          PB_SUPERUSER_EMAIL: ci-super@example.test
          PB_SUPERUSER_PASSWORD: CI-PocketBase-Smoke-2026!
        run: python3 tests/backend/certificate_delivery_smoke.py
      - name: Exercise certificate revoke and replacement lifecycle
        env:
          PB_BASE_URL: http://127.0.0.1:8090
          PB_SUPERUSER_EMAIL: ci-super@example.test
          PB_SUPERUSER_PASSWORD: CI-PocketBase-Smoke-2026!
        run: python3 tests/backend/certificate_lifecycle_smoke.py
      - name: Exercise direct Razorpay integration
        env:
          PB_BASE_URL: http://127.0.0.1:8090
          PB_SUPERUSER_EMAIL: ci-super@example.test
          PB_SUPERUSER_PASSWORD: CI-PocketBase-Smoke-2026!
          RAZORPAY_FAKE_URL: http://127.0.0.1:18080
          RAZORPAY_KEY_SECRET: test_secret_ieee_2026
          RAZORPAY_WEBHOOK_SECRET: test_webhook_ieee_2026
        run: python3 tests/backend/razorpay_direct_smoke.py
      - name: Exercise temporary Kotak PayGate integration
        env:
          PB_BASE_URL: http://127.0.0.1:8090
          PB_SUPERUSER_EMAIL: ci-super@example.test
          PB_SUPERUSER_PASSWORD: CI-PocketBase-Smoke-2026!
          PAYGATE_API_KEY: CI-PayGate-Api-Key-2026!!!!
          PAYGATE_WEBHOOK_SECRET: CI-PayGate-Webhook-2026!!!!
          PAYGATE_FAKE_PORT: "18081"
        run: python3 tests/backend/paygate_smoke.py
      - name: Install certificate renderer fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core
      - name: Build web app for browser E2E
        env:
          DEPLOY_ENV: production
          SITE_URL: https://ieeesahrdaya.com
          POCKETBASE_INTERNAL_URL: http://127.0.0.1:8090
          CERTIFICATE_RENDER_CAPABILITY_KEY: CI-Certificate-Render-Capability-2026-Only-Test
        run: bun run build
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Browser E2E
        env:
          CI: "true"
          DEPLOY_ENV: production
          SITE_URL: https://ieeesahrdaya.com
          POCKETBASE_INTERNAL_URL: http://127.0.0.1:8090
          PB_BASE_URL: http://127.0.0.1:8090
          PB_SUPERUSER_EMAIL: ci-super@example.test
          PB_SUPERUSER_PASSWORD: CI-PocketBase-Smoke-2026!
          CERTIFICATE_RENDER_CAPABILITY_KEY: CI-Certificate-Render-Capability-2026-Only-Test
        run: bun run test:e2e
      - name: Backend logs on failure
        if: failure()
        run: docker logs ieee-pocketbase-ci || true

  container-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        include:
          - name: web
            dockerfile: Dockerfile
          - name: pocketbase
            dockerfile: pocketbase/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ieee-sahrdaya/${{ matrix.name }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
