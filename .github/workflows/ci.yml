name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.5
  IMAGE: ghcr.io/phloraxx/ieee-sahrdaya-web

# Fast path (every push and pull request): one checks job that lints, typechecks,
# tests and builds, plus a short PocketBase smoke.
#
# Release gate (pull requests into main): the full clean-room backend suite and
# Dockerfile builds on arm64.
#
# The web image is built once per commit tree on arm64 and published to GHCR, so
# production pulls it instead of building on the server.

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # setup-bun restores the Bun package cache itself (keyed on bun.lock), so
      # a separate actions/cache step only added a second restore and a post
      # upload that never saved anything after the first run.
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # The certificate renderer's unit tests need real Noto files. Installing
      # them costs ~7 s, so they are installed on the release gate only; on the
      # fast path those tests skip rather than make every dev push slower.
      - name: Install certificate renderer fonts
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.base_ref == 'main')
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core
      - name: Runtime script syntax
        run: bun run check:runtime-syntax
      - name: Typecheck
        run: bun run typecheck
      # Lint, the unit suite and the production build do not touch each other's
      # files, and each leaves cores idle, so they share the runner instead of
      # queueing behind one another. Typecheck runs first because it generates
      # the route types the build uses.
      - name: Lint, unit tests and production build
        run: |
          set -uo pipefail
          bun run lint  & LINT=$!
          bun run test  & TEST=$!
          bun run build & BUILD=$!
          status=0
          wait "$LINT"  || status=1
          wait "$TEST"  || status=1
          wait "$BUILD" || status=1
          exit "$status"

  # A PocketBase boot plus the invariant suites and a populated migration. This
  # is the post-merge sanity check; it is deliberately not the full clean-room.
  smoke-backend:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'dev')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: docker/setup-buildx-action@v4
      - name: Build PocketBase image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: pocketbase/Dockerfile
          load: true
          tags: ieee-pocketbase-ci
          cache-from: type=gha,scope=pocketbase
          cache-to: type=gha,mode=max,scope=pocketbase
      - name: Start fake SMTP server
        env:
          SMTP_FAKE_PORT: "18082"
          SMTP_CAPTURE_PATH: /tmp/fake-smtp-messages.jsonl
        run: |
          python3 tests/backend/fake_smtp.py > /tmp/fake-smtp.log 2>&1 &
          echo $! > /tmp/fake-smtp.pid
          for i in {1..20}; do
            python3 -c 'import socket; s=socket.create_connection(("127.0.0.1", 18082), timeout=1); s.close()' && exit 0 || true
            sleep 1
          done
          cat /tmp/fake-smtp.log
          exit 1
      - name: Start fresh PocketBase
        run: |
          docker run -d --name ieee-pocketbase-ci \
            --add-host=host.docker.internal:host-gateway \
            -p 127.0.0.1:8090:8090 \
            -e DEPLOY_ENV='staging' \
            -e PB_ENCRYPTION_KEY='0123456789abcdef0123456789abcdef' \
            -e PAYGATE_URL='http://host.docker.internal:18081' \
            -e PAYGATE_API_KEY='CI-PayGate-Api-Key-2026-Only-Test-32' \
            -e PAYGATE_WEBHOOK_SECRET='CI-PayGate-Webhook-2026-Only-Test-32' \
            -e CERTIFICATE_RENDER_CAPABILITY_KEY='CI-Certificate-Render-Capability-2026-Only-Test' \
            -e MAIL_DELIVERY_MODE='redirect' \
            -e MAIL_REDIRECT_TO='ci-certificate-sink@example.test' \
            -e SMTP_HOST='host.docker.internal' \
            -e SMTP_PORT='18082' \
            -e SMTP_TLS='false' \
            -e SMTP_FROM='IEEE Sahrdaya <ci-sender@example.test>' \
            ieee-pocketbase-ci
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:8090/api/health >/dev/null && exit 0
            sleep 1
          done
          docker logs ieee-pocketbase-ci
          exit 1
      - name: Create CI superuser
        run: |
          docker exec ieee-pocketbase-ci ./pocketbase superuser upsert \
            ci-super@example.test 'CI-PocketBase-Smoke-2026!' --encryptionEnv=PB_ENCRYPTION_KEY
      - name: Exercise backend invariants
        env:
          PB_BASE_URL: http://127.0.0.1:8090
          PB_SUPERUSER_EMAIL: ci-super@example.test
          PB_SUPERUSER_PASSWORD: CI-PocketBase-Smoke-2026!
          E2E_WORKSPACE_FIXTURE: /tmp/community-workspace-e2e.json
        run: |
          python3 tests/backend/pocketbase_smoke.py
          python3 tests/backend/community_roles_smoke.py
      - name: Exercise certificate template lifecycle
        env:
          PB_BASE_URL: http://127.0.0.1:8090
          PB_SUPERUSER_EMAIL: ci-super@example.test
          PB_SUPERUSER_PASSWORD: CI-PocketBase-Smoke-2026!
          SMTP_CAPTURE_PATH: /tmp/fake-smtp-messages.jsonl
        run: python3 tests/backend/certificate_template_smoke.py
      - name: Verify the PocketBase to SQLite migration against real records
        run: |
          set -euo pipefail
          docker cp ieee-pocketbase-ci:/pb/pb_data /tmp/pb-data
          mkdir -p data
          bunx tsx scripts/migrate-pb-to-sqlite.ts \
            --source /tmp/pb-data/data.db \
            --storage /tmp/pb-data/storage \
            --target ./data/portal.db \
            --uploads ./data/uploads \
            --id-map /tmp/id-map.json \
            --apply
      - name: Backend logs on failure
        if: failure()
        run: docker logs ieee-pocketbase-ci || true

  # The deep gate, on pull requests into main only. It boots a fresh PocketBase,
  # exercises every backend lifecycle and runs the populated migration.
  clean-room-backend:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: docker/setup-buildx-action@v4
      - name: Build PocketBase image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: pocketbase/Dockerfile
          load: true
          tags: ieee-pocketbase-ci
          cache-from: type=gha,scope=pocketbase
          cache-to: type=gha,mode=max,scope=pocketbase
      - name: Start fake SMTP server
        env:
          SMTP_FAKE_PORT: "18082"
          SMTP_CAPTURE_PATH: /tmp/fake-smtp-messages.jsonl
        run: |
          python3 tests/backend/fake_smtp.py > /tmp/fake-smtp.log 2>&1 &
          echo $! > /tmp/fake-smtp.pid
          for i in {1..20}; do
            python3 -c 'import socket; s=socket.create_connection(("127.0.0.1", 18082), timeout=1); s.close()' && exit 0 || true
            sleep 1
          done
          cat /tmp/fake-smtp.log
          exit 1
      - name: Start fresh PocketBase
        run: |
          docker run -d --name ieee-pocketbase-ci \
            --add-host=host.docker.internal:host-gateway \
            -p 127.0.0.1:8090:8090 \
            -e DEPLOY_ENV='staging' \
            -e PB_ENCRYPTION_KEY='0123456789abcdef0123456789abcdef' \
            -e PAYGATE_URL='http://host.docker.internal:18081' \
            -e PAYGATE_API_KEY='CI-PayGate-Api-Key-2026-Only-Test-32' \
            -e PAYGATE_WEBHOOK_SECRET='CI-PayGate-Webhook-2026-Only-Test-32' \
            -e PAYGATE_REGISTRATION_GRACE_SECONDS='600' \
            -e CERTIFICATE_RENDER_CAPABILITY_KEY='CI-Certificate-Render-Capability-2026-Only-Test' \
            -e MAIL_DELIVERY_MODE='redirect' \
            -e MAIL_REDIRECT_TO='ci-certificate-sink@example.test' \
            -e SMTP_HOST='host.docker.internal' \
            -e SMTP_PORT='18082' \
            -e SMTP_TLS='false' \
            -e SMTP_FROM='IEEE Sahrdaya <ci-sender@example.test>' \
            ieee-pocketbase-ci
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:8090/api/health >/dev/null && exit 0
            sleep 1
          done
          docker logs ieee-pocketbase-ci
          exit 1
      - name: Create CI superuser
        run: |
          docker exec ieee-pocketbase-ci ./pocketbase superuser upsert \
            ci-super@example.test 'CI-PocketBase-Smoke-2026!' --encryptionEnv=PB_ENCRYPTION_KEY
      - name: Exercise backend invariants
        env:
          PB_BASE_URL: http://127.0.0.1:8090
          PB_SUPERUSER_EMAIL: ci-super@example.test
          PB_SUPERUSER_PASSWORD: CI-PocketBase-Smoke-2026!
          E2E_WORKSPACE_FIXTURE: /tmp/community-workspace-e2e.json
        run: |
          python3 tests/backend/pocketbase_smoke.py
          python3 tests/backend/community_roles_smoke.py
      - name: Exercise certificate template lifecycle
        env:
          PB_BASE_URL: http://127.0.0.1:8090
          PB_SUPERUSER_EMAIL: ci-super@example.test
          PB_SUPERUSER_PASSWORD: CI-PocketBase-Smoke-2026!
          SMTP_CAPTURE_PATH: /tmp/fake-smtp-messages.jsonl
        run: python3 tests/backend/certificate_template_smoke.py
      - name: Exercise certificate issuance lifecycle
        env:
          PB_BASE_URL: http://127.0.0.1:8090
          PB_SUPERUSER_EMAIL: ci-super@example.test
          PB_SUPERUSER_PASSWORD: CI-PocketBase-Smoke-2026!
        run: python3 tests/backend/certificate_issuance_smoke.py
      - name: Exercise 100-recipient certificate scale
        env:
          PB_BASE_URL: http://127.0.0.1:8090
          PB_SUPERUSER_EMAIL: ci-super@example.test
          PB_SUPERUSER_PASSWORD: CI-PocketBase-Smoke-2026!
        run: python3 tests/backend/certificate_bulk_smoke.py
      - name: Exercise public certificate verification
        env:
          PB_BASE_URL: http://127.0.0.1:8090
          PB_SUPERUSER_EMAIL: ci-super@example.test
          PB_SUPERUSER_PASSWORD: CI-PocketBase-Smoke-2026!
          CERTIFICATE_RENDER_CAPABILITY_KEY: CI-Certificate-Render-Capability-2026-Only-Test
        run: python3 tests/backend/certificate_public_smoke.py
      - name: Exercise certificate delivery lifecycle
        env:
          PB_BASE_URL: http://127.0.0.1:8090
          PB_SUPERUSER_EMAIL: ci-super@example.test
          PB_SUPERUSER_PASSWORD: CI-PocketBase-Smoke-2026!
        run: python3 tests/backend/certificate_delivery_smoke.py
      - name: Exercise certificate revoke and replacement lifecycle
        env:
          PB_BASE_URL: http://127.0.0.1:8090
          PB_SUPERUSER_EMAIL: ci-super@example.test
          PB_SUPERUSER_PASSWORD: CI-PocketBase-Smoke-2026!
        run: python3 tests/backend/certificate_lifecycle_smoke.py
      - name: Exercise PayGate v4 integration
        env:
          PB_BASE_URL: http://127.0.0.1:8090
          PB_SUPERUSER_EMAIL: ci-super@example.test
          PB_SUPERUSER_PASSWORD: CI-PocketBase-Smoke-2026!
          PAYGATE_API_KEY: CI-PayGate-Api-Key-2026-Only-Test-32
          PAYGATE_WEBHOOK_SECRET: CI-PayGate-Webhook-2026-Only-Test-32
          PAYGATE_FAKE_PORT: "18081"
        run: python3 tests/backend/paygate_smoke.py
      - name: Verify the PocketBase to SQLite migration against real records
        run: |
          set -euo pipefail
          docker cp ieee-pocketbase-ci:/pb/pb_data /tmp/pb-data
          mkdir -p data
          bunx tsx scripts/migrate-pb-to-sqlite.ts \
            --source /tmp/pb-data/data.db \
            --storage /tmp/pb-data/storage \
            --target ./data/portal.db \
            --uploads ./data/uploads \
            --id-map /tmp/id-map.json \
            --apply
      - name: Backend logs on failure
        if: failure()
        run: docker logs ieee-pocketbase-ci || true

  # The web image, built on arm64 (the architecture production runs) and
  # published to GHCR per commit tree. Production deploys pull it, so the server
  # no longer compiles anything on the deploy path. The tree tag is what CD
  # resolves: a squash merge keeps the tree of the pull request, so the image
  # built here is the image the merged commit deploys.
  web-image:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Record the commit tree
        id: tree
        run: echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A release PR publishes the image for its tree, and a squash merge keeps
      # that tree, so a normal main push has nothing to build. The check runs
      # only on pushes: PRs always build, so a Dockerfile change is validated
      # before it can merge.
      - name: Check whether this tree is already published
        id: published
        if: github.event_name != 'pull_request'
        run: |
          if docker buildx imagetools inspect "$IMAGE:tree-${{ steps.tree.outputs.tree }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image for this tree is already published; skipping the build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v7
        if: github.event_name == 'pull_request' || steps.published.outputs.exists != 'true'
        with:
          context: .
          file: Dockerfile
          # Every run of this job publishes: a PR into main builds the image the
          # merged commit will deploy, and a main push publishes the image for
          # its own tree when the release PR did not cover it.
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:tree-${{ steps.tree.outputs.tree }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            ieee.tree=${{ steps.tree.outputs.tree }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # PocketBase still builds on deploy (it is the rollback target and changes
  # rarely), so its Dockerfile is validated here rather than published.
  container-builds:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: pocketbase/Dockerfile
          push: false
          tags: ieee-sahrdaya/pocketbase:ci-${{ github.sha }}
          cache-from: type=gha,scope=pocketbase
          cache-to: type=gha,mode=max,scope=pocketbase
