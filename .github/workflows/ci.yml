name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.5

# Fast path (every push and pull request): checks, production build and a short
# PocketBase smoke, in parallel.
#
# Release gate (pull requests into main): the full clean-room backend suite and
# arm64 image builds, so the exact tree that will deploy has been exercised
# before the merge.
#
# A push to main therefore reaches deployment in roughly the time of the slowest
# fast-path job, while the deep backend/image checks still gate every release.

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # The certificate renderer's unit tests need real Noto files. Installing
      # them costs ~7 s, so they are installed on the release gate only; on the
      # fast path those tests skip rather than make every dev push slower.
      - name: Install certificate renderer fonts
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.base_ref == 'main')
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core
      - name: Runtime script syntax
        run: bun run check:runtime-syntax
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Production build
        run: bun run build

  # A PocketBase boot plus the invariant suites and a populated migration. This
  # is the post-merge sanity check; it is deliberately not the full clean-room.
  smoke-backend:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.base_ref == 'dev')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-
      - run: bun install --frozen-lockfile
      - uses: docker/setup-buildx-action@v4
      - name: Build PocketBase image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: pocketbase/Dockerfile
          load: true
          tags: ieee-pocketbase-ci
          cache-from: type=gha,scope=pocketbase
          cache-to: type=gha,mode=max,scope=pocketbase
      - name: Start fake SMTP server
        env:
          SMTP_FAKE_PORT: "18082"
          SMTP_CAPTURE_PATH: /tmp/fake-smtp-messages.jsonl
        run: |
          python3 tests/backend/fake_smtp.py > /tmp/fake-smtp.log 2>&1 &
          echo $! > /tmp/fake-smtp.pid
          for i in {1..20}; do
            python3 -c 'import socket; s=socket.create_connection(("127.0.0.1", 18082), timeout=1); s.close()' && exit 0 || true
            sleep 1
          done
          cat /tmp/fake-smtp.log
          exit 1
      - name: Start fresh PocketBase
        run: |
          docker run -d --name ieee-pocketbase-ci \
            --add-host=host.docker.internal:host-gateway \
            -p 127.0.0.1:8090:8090 \
            -e DEPLOY_ENV='staging' \
            -e PB_ENCRYPTION_KEY='0123456789abcdef0123456789abcdef' \
            -e PAYGATE_URL='http://host.docker.internal:18081' \
            -e PAYGATE_API_KEY='CI-PayGate-Api-Key-2026-Only-Test-32' \
            -e PAYGATE_WEBHOOK_SECRET='CI-PayGate-Webhook-2026-Only-Test-32' \
            -e CERTIFICATE_RENDER_CAPABILITY_KEY='CI-Certificate-Render-Capability-2026-Only-Test' \
            -e MAIL_DELIVERY_MODE='redirect' \
            -e MAIL_REDIRECT_TO='ci-certificate-sink@example.test' \
            -e SMTP_HOST='host.docker.internal' \
            -e SMTP_PORT='18082' \
            -e SMTP_TLS='false' \
            -e SMTP_FROM='IEEE Sahrdaya <ci-sender@example.test>' \
            ieee-pocketbase-ci
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:8090/api/health >/dev/null && exit 0
            sleep 1
          done
          docker logs ieee-pocketbase-ci
          exit 1
      - name: Create CI superuser
        run: |
          docker exec ieee-pocketbase-ci ./pocketbase superuser upsert \
            ci-super@example.test 'CI-PocketBase-Smoke-2026!' --encryptionEnv=PB_ENCRYPTION_KEY
      - name: Exercise backend invariants
        env:
          PB_BASE_URL: http://127.0.0.1:8090
          PB_SUPERUSER_EMAIL: ci-super@example.test
          PB_SUPERUSER_PASSWORD: CI-PocketBase-Smoke-2026!
          E2E_WORKSPACE_FIXTURE: /tmp/community-workspace-e2e.json
        run: |
          python3 tests/backend/pocketbase_smoke.py
          python3 tests/backend/community_roles_smoke.py
      - name: Verify the PocketBase to SQLite migration against real records
        run: |
          set -euo pipefail
          docker cp ieee-pocketbase-ci:/pb/pb_data /tmp/pb-data
          mkdir -p data
          bunx tsx scripts/migrate-pb-to-sqlite.ts \
            --source /tmp/pb-data/data.db \
            --storage /tmp/pb-data/storage \
            --target ./data/portal.db \
            --uploads ./data/uploads \
            --id-map /tmp/id-map.json \
            --apply

  # The deep gate, on pull requests into main only. It boots a fresh PocketBase,
  # exercises every backend lifecycle and runs the populated migration.
  clean-room-backend:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-
      - run: bun install --frozen-lockfile
      - uses: docker/setup-buildx-action@v4
      - name: Build PocketBase image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: pocketbase/Dockerfile
          load: true
          tags: ieee-pocketbase-ci
          cache-from: type=gha,scope=pocketbase
          cache-to: type=gha,mode=max,scope=pocketbase
      - name: Start fake SMTP server
        env:
          SMTP_FAKE_PORT: "18082"
          SMTP_CAPTURE_PATH: /tmp/fake-smtp-messages.jsonl
        run: |
          python3 tests/backend/fake_smtp.py > /tmp/fake-smtp.log 2>&1 &
          echo $! > /tmp/fake-smtp.pid
          for i in {1..20}; do
            python3 -c 'import socket; s=socket.create_connection(("127.0.0.1", 18082), timeout=1); s.close()' && exit 0 || true
            sleep 1
          done
          cat /tmp/fake-smtp.log
          exit 1
      - name: Start fresh PocketBase
        run: |
          docker run -d --name ieee-pocketbase-ci \
            --add-host=host.docker.internal:host-gateway \
            -p 127.0.0.1:8090:8090 \
            -e DEPLOY_ENV='staging' \
            -e PB_ENCRYPTION_KEY='0123456789abcdef0123456789abcdef' \
            -e PAYGATE_URL='http://host.docker.internal:18081' \
            -e PAYGATE_API_KEY='CI-PayGate-Api-Key-2026-Only-Test-32' \
            -e PAYGATE_WEBHOOK_SECRET='CI-PayGate-Webhook-2026-Only-Test-32' \
            -e PAYGATE_REGISTRATION_GRACE_SECONDS='600' \
            -e CERTIFICATE_RENDER_CAPABILITY_KEY='CI-Certificate-Render-Capability-2026-Only-Test' \
            -e MAIL_DELIVERY_MODE='redirect' \
            -e MAIL_REDIRECT_TO='ci-certificate-sink@example.test' \
            -e SMTP_HOST='host.docker.internal' \
            -e SMTP_PORT='18082' \
            -e SMTP_TLS='false' \
            -e SMTP_FROM='IEEE Sahrdaya <ci-sender@example.test>' \
            ieee-pocketbase-ci
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:8090/api/health >/dev/null && exit 0
            sleep 1
          done
          docker logs ieee-pocketbase-ci
          exit 1
      - name: Create CI superuser
        run: |
          docker exec ieee-pocketbase-ci ./pocketbase superuser upsert \
            ci-super@example.test 'CI-PocketBase-Smoke-2026!' --encryptionEnv=PB_ENCRYPTION_KEY
      - name: Exercise backend invariants
        env:
          PB_BASE_URL: http://127.0.0.1:8090
          PB_SUPERUSER_EMAIL: ci-super@example.test
          PB_SUPERUSER_PASSWORD: CI-PocketBase-Smoke-2026!
          E2E_WORKSPACE_FIXTURE: /tmp/community-workspace-e2e.json
        run: |
          python3 tests/backend/pocketbase_smoke.py
          python3 tests/backend/community_roles_smoke.py
      - name: Exercise certificate template lifecycle
        env:
          PB_BASE_URL: http://127.0.0.1:8090
          PB_SUPERUSER_EMAIL: ci-super@example.test
          PB_SUPERUSER_PASSWORD: CI-PocketBase-Smoke-2026!
          SMTP_CAPTURE_PATH: /tmp/fake-smtp-messages.jsonl
        run: python3 tests/backend/certificate_template_smoke.py
      - name: Exercise certificate issuance lifecycle
        env:
          PB_BASE_URL: http://127.0.0.1:8090
          PB_SUPERUSER_EMAIL: ci-super@example.test
          PB_SUPERUSER_PASSWORD: CI-PocketBase-Smoke-2026!
        run: python3 tests/backend/certificate_issuance_smoke.py
      - name: Exercise 100-recipient certificate scale
        env:
          PB_BASE_URL: http://127.0.0.1:8090
          PB_SUPERUSER_EMAIL: ci-super@example.test
          PB_SUPERUSER_PASSWORD: CI-PocketBase-Smoke-2026!
        run: python3 tests/backend/certificate_bulk_smoke.py
      - name: Exercise public certificate verification
        env:
          PB_BASE_URL: http://127.0.0.1:8090
          PB_SUPERUSER_EMAIL: ci-super@example.test
          PB_SUPERUSER_PASSWORD: CI-PocketBase-Smoke-2026!
          CERTIFICATE_RENDER_CAPABILITY_KEY: CI-Certificate-Render-Capability-2026-Only-Test
        run: python3 tests/backend/certificate_public_smoke.py
      - name: Exercise certificate delivery lifecycle
        env:
          PB_BASE_URL: http://127.0.0.1:8090
          PB_SUPERUSER_EMAIL: ci-super@example.test
          PB_SUPERUSER_PASSWORD: CI-PocketBase-Smoke-2026!
        run: python3 tests/backend/certificate_delivery_smoke.py
      - name: Exercise certificate revoke and replacement lifecycle
        env:
          PB_BASE_URL: http://127.0.0.1:8090
          PB_SUPERUSER_EMAIL: ci-super@example.test
          PB_SUPERUSER_PASSWORD: CI-PocketBase-Smoke-2026!
        run: python3 tests/backend/certificate_lifecycle_smoke.py
      - name: Exercise PayGate v4 integration
        env:
          PB_BASE_URL: http://127.0.0.1:8090
          PB_SUPERUSER_EMAIL: ci-super@example.test
          PB_SUPERUSER_PASSWORD: CI-PocketBase-Smoke-2026!
          PAYGATE_API_KEY: CI-PayGate-Api-Key-2026-Only-Test-32
          PAYGATE_WEBHOOK_SECRET: CI-PayGate-Webhook-2026-Only-Test-32
          PAYGATE_FAKE_PORT: "18081"
        run: python3 tests/backend/paygate_smoke.py
      - name: Verify the PocketBase to SQLite migration against real records
        run: |
          set -euo pipefail
          docker cp ieee-pocketbase-ci:/pb/pb_data /tmp/pb-data
          mkdir -p data
          bunx tsx scripts/migrate-pb-to-sqlite.ts \
            --source /tmp/pb-data/data.db \
            --storage /tmp/pb-data/storage \
            --target ./data/portal.db \
            --uploads ./data/uploads \
            --id-map /tmp/id-map.json \
            --apply
      - name: Backend logs on failure
        if: failure()
        run: docker logs ieee-pocketbase-ci || true

  # Dockerfile validation on the release gate. Production builds its own image
  # inside Dokploy, so this is not on the deploy path; it runs on arm64, the
  # architecture production uses, and would have caught the Bun 1.2.9 hang.
  container-builds:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 25
    strategy:
      matrix:
        include:
          - name: web
            dockerfile: Dockerfile
            runs_on: ubuntu-24.04-arm
          - name: pocketbase
            dockerfile: pocketbase/Dockerfile
            runs_on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ieee-sahrdaya/${{ matrix.name }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
