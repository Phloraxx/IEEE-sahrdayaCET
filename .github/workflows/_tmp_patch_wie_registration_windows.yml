name: Temporary WIE registration window patch

on:
  push:
    branches:
      - fix/events-public-lifecycle

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[wie-registration-window-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/events-public-lifecycle
          fetch-depth: 0

      - name: Add lifecycle fields to WIE event mapping
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('src/routes/societies_.wie.tsx')
          text = path.read_text()
          old = '      date: (e.date as string) || "",\n      venue:'
          new = '      date: (e.date as string) || "",\n      endDate: (e.endDate as string) || "",\n      registrationStart: (e.registrationStart as string) || "",\n      registrationDeadline: (e.registrationDeadline as string) || "",\n      venue:'
          if old not in text:
              raise SystemExit('WIE event mapping pattern not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/societies_.wie.tsx
          git commit -m "fix(events): add registration windows to WIE events [wie-registration-window-patched]"
          git push origin HEAD:fix/events-public-lifecycle
