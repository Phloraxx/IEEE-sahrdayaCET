name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verify tested SHA is still branch head
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          CURRENT_SHA=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/$BRANCH" | jq -r .sha)
          if [ "$CURRENT_SHA" != "$TESTED_SHA" ]; then
            echo "A newer commit is already on $BRANCH; its CI run will deploy instead."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy tested main through Dokploy webhook
        if: steps.freshness.outputs.skip != 'true'
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          PROD_WEBHOOK: ${{ secrets.DOCKPLOY_WEBHOOK_PROD }}
        run: |
          set -euo pipefail
          : "${PROD_WEBHOOK:?Dokploy production webhook is required}"
          echo "Triggering CI-approved production deployment for ${TESTED_SHA:0:12}"
          curl --fail-with-body --silent --show-error \
            -X POST "$PROD_WEBHOOK" \
            -H "X-GitHub-Event: push" \
            -H "Content-Type: application/json" \
            --data "$(jq -nc --arg ref "refs/heads/$BRANCH" '{ref:$ref}')"