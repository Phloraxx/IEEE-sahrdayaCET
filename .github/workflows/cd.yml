name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, dev]

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
    env:
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      DEPLOY_BRANCH: ${{ github.event.workflow_run.head_branch == 'main' && 'deploy/production' || 'deploy/staging' }}
      TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
      TARGET: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
      DEPLOY_WEBHOOK: ${{ github.event.workflow_run.head_branch == 'main' && secrets.DOCKPLOY_WEBHOOK_PROD || secrets.DOCKPLOY_WEBHOOK_DEV }}
    steps:
      - name: Verify tested SHA is still branch head
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_SHA=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/$BRANCH" | jq -r .sha)
          if [ "$CURRENT_SHA" != "$TESTED_SHA" ]; then
            echo "A newer commit is already on $BRANCH; its CI run will deploy instead."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pin tested SHA to immutable deployment branch
        if: steps.freshness.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${{ github.repository }}"
          AUTH=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          GET_CODE=$(curl --silent --show-error -o /tmp/deploy-ref.json -w '%{http_code}' \
            "${AUTH[@]}" "$API/git/ref/heads/$DEPLOY_BRANCH")
          if [ "$GET_CODE" = "200" ]; then
            curl --fail-with-body --silent --show-error -X PATCH \
              "${AUTH[@]}" -H "Content-Type: application/json" \
              "$API/git/refs/heads/$DEPLOY_BRANCH" \
              --data "$(jq -nc --arg sha "$TESTED_SHA" '{sha:$sha,force:true}')" >/dev/null
          elif [ "$GET_CODE" = "404" ]; then
            curl --fail-with-body --silent --show-error -X POST \
              "${AUTH[@]}" -H "Content-Type: application/json" \
              "$API/git/refs" \
              --data "$(jq -nc --arg ref "refs/heads/$DEPLOY_BRANCH" --arg sha "$TESTED_SHA" '{ref:$ref,sha:$sha}')" >/dev/null
          else
            cat /tmp/deploy-ref.json
            echo "Unexpected GitHub ref lookup status: $GET_CODE" >&2
            exit 1
          fi
          PINNED_SHA=$(curl --fail-with-body --silent --show-error \
            "${AUTH[@]}" "$API/git/ref/heads/$DEPLOY_BRANCH" | jq -r .object.sha)
          test "$PINNED_SHA" = "$TESTED_SHA"
          echo "Pinned $DEPLOY_BRANCH to ${TESTED_SHA:0:12}"

      - name: Deploy pinned SHA through Dokploy webhook
        if: steps.freshness.outputs.skip != 'true'
        run: |
          set -euo pipefail
          : "${DEPLOY_WEBHOOK:?Dokploy $TARGET webhook is required}"
          echo "Triggering CI-approved $TARGET deployment for ${TESTED_SHA:0:12} via $DEPLOY_BRANCH"
          HTTP_CODE=$(curl --silent --show-error -o /tmp/dokploy-response.json -w '%{http_code}' \
            -X POST "$DEPLOY_WEBHOOK" \
            -H "X-GitHub-Event: push" \
            -H "Content-Type: application/json" \
            --data "$(jq -nc \
              --arg ref "refs/heads/$DEPLOY_BRANCH" \
              --arg sha "$TESTED_SHA" \
              --arg message "CI-approved $TARGET deployment" \
              '{ref:$ref,head_commit:{id:$sha,message:$message},commits:[{added:[],modified:[],removed:[]}]}')")
          cat /tmp/dokploy-response.json
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Dokploy webhook returned HTTP $HTTP_CODE" >&2
            exit 1
          fi
          jq -e '.message == "Compose deployed successfully"' /tmp/dokploy-response.json >/dev/null
