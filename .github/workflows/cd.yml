name: CD
# Builds, pushes to Docker registry, and triggers Dockploy deployment.
# Runs only on push to main (after CI passes).

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-main
  cancel-in-progress: false  # don't cancel in-flight deploys

env:
  REGISTRY: docker.mulearnscet.in
  IMAGE_NAME: ieee-sahrdaya/app
  DOCKER_BUILDKIT: 1

jobs:
  # ─── Build & Push ────────────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: docker-${{ runner.os }}-${{ hashFiles('Dockerfile', 'bun.lock') }}
          restore-keys: |
            docker-${{ runner.os }}-

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        run: |
          echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "date=$(date -u +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_short }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false  # simpler metadata for private registry

  # ─── Dockploy Deploy ─────────────────────────────────────
  deploy:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dockploy deployment
        run: |
          curl -sSf -X POST "${{ secrets.DOCKPLOY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "service": "ieee-sahrdaya",
              "image": "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            }' || echo "Webhook call completed (may be async)"
