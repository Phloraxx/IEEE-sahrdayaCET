name: CD
# Triggers Dokploy deployment after CI passes on main.
# Dokploy uses the GitHub App integration to clone source and build from Dockerfile.
# This workflow ensures the image is built and tested first, then tells Dokploy to deploy.

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-main
  cancel-in-progress: false

jobs:
  # ─── Build & Push to Dokploy's internal registry ────
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Dokploy internal registry
        uses: docker/login-action@v3
        with:
          registry: docker.mulearnscet.in
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: docker.mulearnscet.in/ieee-sahrdaya/app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Trigger Dokploy Deploy ────────────────────────
  deploy:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy deployment
        run: |
          curl -sSf -X POST "${{ secrets.DOCKPLOY_WEBHOOK_URL }}" \
            -H "X-GitHub-Event: push" \
            -H "Content-Type: application/json" \
            -d '{"ref": "refs/heads/${{ vars.DOKPLOY_BRANCH || 'main' }}"}' || echo "Webhook call completed"
