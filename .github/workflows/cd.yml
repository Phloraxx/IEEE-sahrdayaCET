# Production only. Staging is deployed from your own machine with
# scripts/deploy-local.sh, which runs the same checks without waiting for CI and
# without a registry round-trip; see docs/deployment.md. Keeping this workflow
# on `main` alone is what makes the two lanes distinct: the gate protects
# production, and nothing gates the staging playground.
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      DEPLOY_BRANCH: deploy/production
      TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
      TARGET: production
      DEPLOY_WEBHOOK: ${{ secrets.DOCKPLOY_WEBHOOK_PROD }}
      IMAGE: ghcr.io/phloraxx/ieee-sahrdaya-web
    steps:
      - name: Verify tested SHA is still branch head
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_SHA=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/$BRANCH" | jq -r .sha)
          if [ "$CURRENT_SHA" != "$TESTED_SHA" ]; then
            echo "A newer commit is already on $BRANCH; its CI run will deploy instead."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pin tested SHA to immutable deployment branch
        if: steps.freshness.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${{ github.repository }}"
          AUTH=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          GET_CODE=$(curl --silent --show-error -o /tmp/deploy-ref.json -w '%{http_code}' \
            "${AUTH[@]}" "$API/git/ref/heads/$DEPLOY_BRANCH")
          if [ "$GET_CODE" = "200" ]; then
            curl --fail-with-body --silent --show-error -X PATCH \
              "${AUTH[@]}" -H "Content-Type: application/json" \
              "$API/git/refs/heads/$DEPLOY_BRANCH" \
              --data "$(jq -nc --arg sha "$TESTED_SHA" '{sha:$sha,force:true}')" >/dev/null
          elif [ "$GET_CODE" = "404" ]; then
            curl --fail-with-body --silent --show-error -X POST \
              "${AUTH[@]}" -H "Content-Type: application/json" \
              "$API/git/refs" \
              --data "$(jq -nc --arg ref "refs/heads/$DEPLOY_BRANCH" --arg sha "$TESTED_SHA" '{ref:$ref,sha:$sha}')" >/dev/null
          else
            cat /tmp/deploy-ref.json
            echo "Unexpected GitHub ref lookup status: $GET_CODE" >&2
            exit 1
          fi
          PINNED_SHA=$(curl --fail-with-body --silent --show-error \
            "${AUTH[@]}" "$API/git/ref/heads/$DEPLOY_BRANCH" | jq -r .object.sha)
          test "$PINNED_SHA" = "$TESTED_SHA"
          echo "Pinned $DEPLOY_BRANCH to ${TESTED_SHA:0:12}"

      # Production deploys pull the image CI built for this commit instead of
      # building on the server. The image is tagged by the commit's tree, which
      # a squash merge preserves; the mutable :production tag is moved here, so
      # a rollback (repointing deploy/production) also rolls the image back.
      # Resolve the tree of the image CI actually published, and attach it to the
      # mutable :production tag.
      #
      # The tree of *main's commit* is not necessarily the tree of the image that
      # gets deployed. A release PR merges to a **merge commit** whose SHA is new;
      # CI built the image for the PR head's tree, and that tree is preserved by
      # the merge, but the commit SHA the webhook deploys can differ. So the
      # authoritative value is the artifact's own `ieee.tree` label, read from the
      # registry after resolving the `tree-<tree>` tag. Job-level env carries it
      # to the verification step, which compares it with what the origin reports.
      - name: Attach this commit's image to the production tag
        if: steps.freshness.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          GIT_TREE=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/$TESTED_SHA" | jq -r .commit.tree.sha)
          echo "commit tree (git) = $GIT_TREE"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          # The runner ships buildx, but the retag must not depend on a builder:
          # imagetools only talks to the registry, and docker manifest is the
          # bundled fallback.
          inspect() {
            if docker buildx version >/dev/null 2>&1; then
              docker buildx imagetools inspect "$1"
            else
              docker manifest inspect "$1"
            fi
          }
          retag() {
            if docker buildx version >/dev/null 2>&1; then
              docker buildx imagetools create -t "$1" "$2"
            else
              docker manifest create "$1" "$2"
              docker manifest push "$1"
            fi
          }
          if ! inspect "$IMAGE:tree-$GIT_TREE" >/dev/null 2>&1; then
            echo "::error::No image is published for tree $GIT_TREE, so production cannot pull this commit. CI's web-image job publishes one on every push to main; re-run it, or deploy this commit with scripts/deploy-local.sh (it builds on the server)."
            exit 1
          fi

          # The artifact's own tree label is the value to verify against: read it
          # from the structured registry config, never from parsed human output
          # (`imagetools inspect --raw` on an index has no labels at all). If the
          # image predates the tree label, fall back to the git tree resolved
          # above and say so; the verification then checks the origin against the
          # source tree, which is still the right question.
          ARTIFACT_TREE=$(docker buildx imagetools inspect "$IMAGE:tree-$GIT_TREE" \
            --format '{{json .Image}}' 2>/dev/null \
            | jq -r '.config.Labels["ieee.tree"] // empty' 2>/dev/null || true)
          if [ -z "$ARTIFACT_TREE" ]; then
            echo "::warning::The published image carries no ieee.tree label; verifying against the commit tree $GIT_TREE instead."
            ARTIFACT_TREE="$GIT_TREE"
          elif [ "$ARTIFACT_TREE" != "$GIT_TREE" ]; then
            echo "::error::The published image is labelled ieee.tree=$ARTIFACT_TREE but the tested commit's tree is $GIT_TREE; refusing to deploy an image that does not match its tag."
            exit 1
          fi
          echo "DEPLOY_TREE=$ARTIFACT_TREE" >> "$GITHUB_ENV"
          echo "artifact tree = $ARTIFACT_TREE"

          retag "$IMAGE:production" "$IMAGE:tree-$GIT_TREE"
          echo "production now resolves to:"
          inspect "$IMAGE:production" | grep -m1 -i digest || true

      - name: Deploy pinned SHA through Dokploy webhook
        if: steps.freshness.outputs.skip != 'true'
        run: |
          set -euo pipefail
          : "${DEPLOY_WEBHOOK:?Dokploy $TARGET webhook is required}"
          echo "Triggering CI-approved $TARGET deployment for ${TESTED_SHA:0:12} via $DEPLOY_BRANCH"
          HTTP_CODE=$(curl --silent --show-error -o /tmp/dokploy-response.json -w '%{http_code}' \
            -X POST "$DEPLOY_WEBHOOK" \
            -H "X-GitHub-Event: push" \
            -H "Content-Type: application/json" \
            --data "$(jq -nc \
              --arg ref "refs/heads/$DEPLOY_BRANCH" \
              --arg sha "$TESTED_SHA" \
              --arg message "CI-approved $TARGET deployment" \
              '{ref:$ref,head_commit:{id:$sha,message:$message},commits:[{added:[],modified:[],removed:[]}]}')")
          cat /tmp/dokploy-response.json
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Dokploy webhook returned HTTP $HTTP_CODE" >&2
            exit 1
          fi
          jq -e '.message == "Compose deployed successfully"' /tmp/dokploy-response.json >/dev/null

      # The webhook's 200 means Dokploy ran `docker compose up`. It does not mean
      # the origin is serving the image CI published: it could be stale, the
      # container could have been recreated but not replaced, or Traefik could
      # point at another container. This asks the deployment itself.
      #
      # The comparison is on the **tree-only** fingerprint, against the tree of
      # the image CI actually published (`DEPLOY_TREE`, exported by the retag
      # step from the artifact's `ieee.tree` label). Commit is deliberately not
      # part of it: a release PR merging to main produces a merge commit whose
      # SHA differs from the PR head, while the tree — and therefore the image —
      # is the same. Keying on commit+tree would fail correct deploys.
      - name: Verify the deployed build is the tested release
        if: steps.freshness.outputs.skip != 'true'
        env:
          ORIGIN: https://ieeesahrdaya.com
        run: |
          set -euo pipefail
          : "${DEPLOY_TREE:?the retag step must export DEPLOY_TREE}"
          # Must match src/server/build-identity.server.ts:buildFingerprint().
          # bash's printf expands \0, so the separator is a real NUL.
          want=$(printf 'ieee-tree\0%s' "$DEPLOY_TREE" | sha256sum | cut -c1-16)
          echo "expected build fingerprint $want for tree ${DEPLOY_TREE:0:12}"

          body=""
          got=""
          deadline=$((SECONDS + 300))
          while (( SECONDS < deadline )); do
            body=$(curl --max-time 15 -sS "$ORIGIN/healthz" || true)
            got=$(jq -r '.build // ""' <<<"$body" 2>/dev/null || true)
            if [ "$got" = "$want" ] && jq -e '.ok == true' <<<"$body" >/dev/null 2>&1; then
              echo "origin reports $got and is ready"
              exit 0
            fi
            echo "origin: $(jq -c '{ok,status,build,degraded,checks}' <<<"$body" 2>/dev/null || echo "${body:-<no response>}")"
            sleep 10
          done

          echo "::error::The deployment did not report the tested release within 300 s (expected build $want for tree ${DEPLOY_TREE:0:12}, got '${got:-<none>}'). Dokploy returned success, so this is a stale, replaced or misrouted container, or an image built without the tree build arg. See docs/deployment.md § Health and readiness."
          exit 1
