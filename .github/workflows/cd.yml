name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
    env:
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
      TARGET: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
      DEPLOY_WEBHOOK: ${{ github.event.workflow_run.head_branch == 'main' && secrets.DOCKPLOY_WEBHOOK_PROD || secrets.DOCKPLOY_WEBHOOK_DEV }}
    steps:
      - name: Verify tested SHA is still branch head
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_SHA=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/$BRANCH" | jq -r .sha)
          if [ "$CURRENT_SHA" != "$TESTED_SHA" ]; then
            echo "A newer commit is already on $BRANCH; its CI run will deploy instead."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy tested branch through Dokploy webhook
        if: steps.freshness.outputs.skip != 'true'
        run: |
          set -euo pipefail
          : "${DEPLOY_WEBHOOK:?Dokploy $TARGET webhook is required}"
          echo "Triggering CI-approved $TARGET deployment for ${TESTED_SHA:0:12} from $BRANCH"
          curl --fail-with-body --silent --show-error \
            -X POST "$DEPLOY_WEBHOOK" \
            -H "X-GitHub-Event: push" \
            -H "Content-Type: application/json" \
            --data "$(jq -nc \
              --arg ref "refs/heads/$BRANCH" \
              --arg sha "$TESTED_SHA" \
              --arg message "CI-approved $TARGET deployment" \
              '{ref:$ref,head_commit:{id:$sha,message:$message},commits:[{modified:[]}]}')"
