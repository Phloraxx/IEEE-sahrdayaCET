name: CD
# Builds Docker image, pushes to Dokploy, and triggers deployment.

on:
  push:
    branches: [main, "docs/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: docker.mulearnscet.in
  IMAGE: ieee-sahrdaya/app

jobs:
  # ─── Build & Push ────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Dokploy internal registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Trigger Dokploy Deploy ──────────────────────
  deploy:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy deployment
        run: |
          curl -sSf -X POST "${{ secrets.DOCKPLOY_WEBHOOK_URL }}" \
            -H "X-GitHub-Event: push" \
            -H "Content-Type: application/json" \
            -d '{"ref": "refs/heads/${{ github.ref_name }}"}' || echo "Webhook call completed"
