name: Temporary society registration window patch

on:
  push:
    branches:
      - fix/events-public-lifecycle

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[society-registration-window-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/events-public-lifecycle
          fetch-depth: 0

      - name: Apply lifecycle helper consistently
        run: |
          python <<'PY'
          from pathlib import Path

          paths = [
              Path('src/routes/societies_.$slug.tsx'),
              Path('src/routes/societies_.wie.tsx'),
          ]

          for path in paths:
              text = path.read_text()
              text = text.replace(
                  'import { isPastEvent } from "@/lib/event-lifecycle";',
                  'import { canRegisterForEvent } from "@/lib/event-lifecycle";',
                  1,
              )

              interface_fields = '    endDate: string;\n    venue: string;'
              if interface_fields in text:
                  text = text.replace(
                      interface_fields,
                      '    endDate: string;\n    registrationStart: string;\n    registrationDeadline: string;\n    venue: string;',
                      1,
                  )

              mapping_fields = '        endDate: (e.endDate as string) || "",\n        venue:'
              if mapping_fields in text:
                  text = text.replace(
                      mapping_fields,
                      '        endDate: (e.endDate as string) || "",\n        registrationStart: (e.registrationStart as string) || "",\n        registrationDeadline: (e.registrationDeadline as string) || "",\n        venue:',
                      1,
                  )

              old_condition = '{event.externalFormUrl && event.status === "published" && !isPastEvent(event) && ('
              new_condition = '{event.externalFormUrl && canRegisterForEvent({ ...event, registrationOpen: true }) && ('
              if old_condition not in text:
                  raise SystemExit(f'Lifecycle condition not found in {path}')
              text = text.replace(old_condition, new_condition, 1)
              path.write_text(text)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/routes/societies_.$slug.tsx' src/routes/societies_.wie.tsx
          git commit -m "fix(events): enforce registration windows on society pages [society-registration-window-patched]"
          git push origin HEAD:fix/events-public-lifecycle
