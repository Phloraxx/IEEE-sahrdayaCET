name: Preview Smoke

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  public-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve this PR's Dokploy preview URL
        id: preview-url
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            for (let attempt = 1; attempt <= 24; attempt++) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number, per_page: 100
              })
              const deployment = comments.find((comment) =>
                comment.body?.includes('### Dokploy Preview Deployment')
              )
              const match = deployment?.body?.match(/\[Preview URL\]\((https?:\/\/[^)]+)\)/)
              if (match?.[1]) return match[1].replace(/^http:/, 'https:')
              core.info(`Dokploy preview URL not available yet (${attempt}/24)`)
              await new Promise((resolve) => setTimeout(resolve, 5000))
            }
            core.setFailed('Dokploy preview URL was not published on this PR')
            return ''
      - name: Crawl Dokploy preview
        env:
          PREVIEW_BASE: ${{ steps.preview-url.outputs.result }}
          PUBLIC_POCKETBASE_URL: https://db.ieeesahrdaya.com
        run: |
          set -o pipefail
          node scripts/smoke-preview.mjs 2>&1 | tee preview-smoke.log
      - name: Publish preview smoke report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- preview-smoke-report -->'
            const log = fs.existsSync('preview-smoke.log')
              ? fs.readFileSync('preview-smoke.log', 'utf8').slice(-12000)
              : 'Smoke log was not created.'
            const body = `${marker}\n### Preview Smoke Report\n\n\`\`\`text\n${log}\n\`\`\``
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 })
            const existing = comments.find((comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }
