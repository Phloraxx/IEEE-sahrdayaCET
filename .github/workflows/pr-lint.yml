name: PR Lint

# Enforces conventional-commit titles on PRs and a small set of required
# labels. Runs on PR open/edit. Non-blocking annotation (warning) unless
# the title is non-conventional, in which case the job fails.
#
# Conventional commits are how the version workflow (bump-version.yml)
# and any future release-please/semantic-release integration determine
# bump levels. Enforcing them now keeps that option open.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read
  statuses: write

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Allow the common types used in this repo's history.
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            chore
            ci
            build
            debug
            style
          # Scope is optional and free-form (e.g. feat(auth):, fix(fifa):)
          requireScope: false