# Local development intentionally runs only the stateful backend in Docker.
# Run `bun run dev` on the host; Vite serves :3000 and proxies /api to :8090.
services:
  pocketbase:
    build:
      context: .
      dockerfile: pocketbase/Dockerfile
      args:
        PB_VERSION: "0.39.9"
    environment:
      PB_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      RAZORPAY_API_BASE_URL: ${RAZORPAY_API_BASE_URL:-https://api.razorpay.com}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_CHECKOUT_HOLD_SECONDS: ${RAZORPAY_CHECKOUT_HOLD_SECONDS:-600}
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-true}
      PAYGATE_URL: ${PAYGATE_URL:-}
      PAYGATE_API_KEY: ${PAYGATE_API_KEY:-}
      PAYGATE_WEBHOOK_SECRET: ${PAYGATE_WEBHOOK_SECRET:-}
      PAYGATE_REGISTRATION_GRACE_SECONDS: ${PAYGATE_REGISTRATION_GRACE_SECONDS:-600}
      PAYGATE_WEBHOOK_TOLERANCE_SECONDS: ${PAYGATE_WEBHOOK_TOLERANCE_SECONDS:-300}
      FOOTBALL_DATA_API_TOKEN: ${FOOTBALL_DATA_API_TOKEN:-}
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - local_pb_data:/pb/pb_data
      - ./pb_hooks:/pb/pb_hooks:ro
      - ./pb_migrations:/pb/pb_migrations:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  local_pb_data:
