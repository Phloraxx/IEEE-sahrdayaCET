
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap');
    * { font-family: 'Inter', system-ui, sans-serif; box-sizing: border-box; }
    body { overflow: hidden; height: 100vh; background: #0f172a; }

    /* ── System ── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }

    .scrollable { overflow-y: auto; scroll-behavior: smooth; }
    .scrollable::-webkit-scrollbar { width: 4px; }
    .scrollable::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9px; }

    /* ── Sidebar ── */
    .sidebar { 
      width: 240px; 
      background: #0f172a; 
      border-right: 1px solid #1e293b;
      display: flex; flex-direction: column;
      transition: width .2s, transform .2s;
    }
    .sidebar.collapsed { width: 60px; }
    .sidebar.collapsed .sidebar-label { display: none; }
    .sidebar.collapsed .sidebar-logo span { display: none; }
    .sidebar.collapsed .sidebar-section { display: none; }
    .sidebar.collapsed .sidebar-link { justify-content: center; padding: 10px; }
    .sidebar.collapsed .sidebar-link svg { margin: 0; }

    .sidebar-link {
      display: flex; align-items: center; gap: 12px; 
      padding: 9px 14px; margin: 1px 8px;
      border-radius: 8px; color: #94a3b8; font-size: 13.5px; font-weight: 500;
      transition: all .15s; cursor: pointer; position: relative;
      white-space: nowrap;
    }
    .sidebar-link:hover { background: #1e293b; color: #f1f5f9; }
    .sidebar-link.active { 
      background: #0d9488/15; color: #2dd4bf; 
    }
    .sidebar-link.active::before {
      content: ''; position: absolute; left: -8px; top: 50%; transform: translateY(-50%);
      width: 3px; height: 20px; background: #14b8a6; border-radius: 0 3px 3px 0;
    }
    .sidebar-link svg { width: 18px; height: 18px; flex-shrink: 0; }

    .sidebar-section {
      padding: 8px 14px 4px; font-size: 11px; font-weight: 600; color: #475569;
      text-transform: uppercase; letter-spacing: .08em;
    }

    /* ── Top Bar ── */
    .topbar {
      height: 56px; background: #fff; border-bottom: 1px solid #f1f5f9;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; flex-shrink: 0;
    }

    /* ── Cards ── */
    .card {
      background: #fff; border: 1px solid #f1f5f9; border-radius: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,.02); transition: box-shadow .15s;
    }
    .card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.04); }

    /* ── Stats ── */
    .stat { padding: 18px 20px; }
    .stat-value { font-size: 26px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
    .stat-label { font-size: 13px; color: #64748b; font-weight: 500; }

    /* ── Tables ── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { 
      text-align: left; padding: 10px 16px; font-weight: 600; color: #64748b;
      font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
      border-bottom: 1px solid #f1f5f9; background: #fafbfc; white-space: nowrap;
    }
    td { padding: 10px 16px; border-bottom: 1px solid #f1f5f9; color: #1e293b; white-space: nowrap; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f8fafc; }

    .avatar {
      width: 28px; height: 28px; border-radius: 9999px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 600; color: #fff; flex-shrink: 0;
    }

    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 10px; border-radius: 9999px; font-size: 11.5px; font-weight: 600;
      letter-spacing: .01em;
    }

    .sparkline { display: flex; align-items: flex-end; gap: 2px; height: 28px; }
    .sparkline span { width: 4px; border-radius: 2px 2px 0 0; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
      transition: all .15s; cursor: pointer; border: none; line-height: 1;
    }
    .btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 6px; }
    .btn-ghost { color: #64748b; background: transparent; }
    .btn-ghost:hover { background: #f1f5f9; color: #1e293b; }
    .btn-primary { background: #14b8a6; color: #fff; }
    .btn-primary:hover { background: #0d9488; }
    .btn-outline { border: 1px solid #e2e8f0; color: #475569; background: #fff; }
    .btn-outline:hover { border-color: #cbd5e1; background: #f8fafc; }
    .btn-icon { padding: 6px; min-width: 32px; justify-content: center; }
    .btn-red { color: #ef4444; background: #fef2f2; }
    .btn-red:hover { background: #fee2e2; }

    /* ── Kanban ── */
    .kanban-column {
      min-width: 280px; flex-shrink: 0;
      background: #f8fafc; border-radius: 10px; padding: 14px;
    }
    .kanban-card {
      background: #fff; border: 1px solid #f1f5f9; border-radius: 8px;
      padding: 12px 14px; cursor: default; margin-bottom: 8px;
      transition: box-shadow .15s, transform .15s;
    }
    .kanban-card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.06); transform: translateY(-1px); }
    .kanban-card.dragging { opacity: .5; }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(15,23,42,.5); backdrop-filter: blur(4px);
      display: none; align-items: flex-start; justify-content: center; padding-top: 8vh; z-index: 100;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #fff; border-radius: 14px; width: 100%; max-width: 560px;
      box-shadow: 0 20px 60px rgba(0,0,0,.15); max-height: 80vh; overflow-y: auto;
    }
    .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 24px; border-bottom: 1px solid #f1f5f9; }
    .modal-body { padding: 24px; }
    .modal-footer { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 14px 24px; border-top: 1px solid #f1f5f9; }

    /* ── Forms ── */
    input, select, textarea {
      width: 100%; padding: 8px 12px; border: 1px solid #e2e8f0; border-radius: 8px;
      font-size: 13px; background: #fff; transition: border .15s, box-shadow .15s;
      outline: none; color: #1e293b;
    }
    input:focus, select:focus, textarea:focus { border-color: #14b8a6; box-shadow: 0 0 0 3px rgba(20,184,166,.15); }
    label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 4px; }
    .form-group { margin-bottom: 16px; }

    /* ── Page utilities ── */
    .page { display: none; height: 100%; }
    .page.active { display: flex; flex-direction: column; }
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-shrink: 0; }
    .page-title { font-size: 20px; font-weight: 700; letter-spacing: -.02em; color: #0f172a; }
    .page-subtitle { font-size: 13px; color: #64748b; margin-top: 2px; }

    .content-area {
      flex: 1; overflow-y: auto; padding-bottom: 40px;
      background: #f8fafc;
    }

    .input-group { position: relative; }
    .input-group svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: #94a3b8; }
    .input-group input { padding-left: 34px; }

    .filter-chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: 500;
      border: 1px solid #e2e8f0; color: #475569; cursor: pointer; background: #fff;
      transition: all .15s;
    }
    .filter-chip:hover, .filter-chip.active { border-color: #14b8a6; color: #0d9488; background: #f0fdfa; }

    .progress-bar { height: 6px; border-radius: 9999px; background: #f1f5f9; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 9999px; transition: width .4s; }

    .activity-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid #f1f5f9; }
    .activity-item:last-child { border-bottom: none; }
    .activity-dot { width: 8px; height: 8px; border-radius: 9999px; margin-top: 5px; flex-shrink: 0; }

    @media (max-width: 1023px) {
      .sidebar { position: fixed; inset: 0; z-index: 60; transform: translateX(-100%); width: 260px !important; }
      .sidebar.open { transform: translateX(0); }
      .sidebar-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 59; }
      .sidebar-backdrop.open { display: block; }
    }
  </style>
</head>
<body>
  <div class="flex h-full">
    <!-- Sidebar Backdrop (mobile) -->
    <div id="sidebarBackdrop" class="sidebar-backdrop" onclick="toggleSidebar()"></div>

    <!-- ─── SIDEBAR ─── -->
    <aside id="sidebar" class="sidebar z-50 relative">
      <div class="sidebar-logo flex items-center gap-2.5 px-4 h-14 border-b border-slate-800/60">

        <span class="font-semibold text-sm text-white tracking-tight">Admin Panel</span>

        </div>
        <div class="sidebar-link" data-page="tasks" onclick="navigate('tasks')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <span class="sidebar-label">Tasks</span>
        </div>

        <div class="sidebar-section mt-6">Finance</div>
        <div class="sidebar-link" data-page="payments" onclick="navigate('payments')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
          <span class="sidebar-label">Payments</span>
        </div>
        <div class="sidebar-link" data-page="subscriptions" onclick="navigate('subscriptions')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
          <span class="sidebar-label">Subscriptions</span>

        <div class="sidebar-section mt-6">System</div>

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>

        <div class="sidebar-link" data-page="logs" onclick="navigate('logs')">

      <div class="flex items-center gap-2.5 p-4 border-t border-slate-800/60">

    <!-- ─── MAIN ─── -->
    <div class="flex-1 flex flex-col min-w-0 bg-slate-50">
      
      <!-- Top Bar -->

        <div class="flex items-center gap-4">
          <button onclick="toggleSidebar()" class="btn-icon btn-ghost lg:hidden text-slate-600">
