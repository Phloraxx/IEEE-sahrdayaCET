# ─────────────────────────────────────────────────────────────
#  IEEE Sahrdaya — PocketBase (with pb_hooks + pb_migrations)
#  Deploy this via Dokploy as a separate service.
#  The app has its own compose (docker-compose.yml).
# ─────────────────────────────────────────────────────────────

services:
  pocketbase:
    image: adrianmusante/pocketbase:0.39.1
    restart: always
    expose:
      - 8090
    # Attach explicitly to Dokploy's shared overlay so the container gets BOTH
    # inbound routing (Traefik) AND outbound internet egress. Without this a
    # Compose-deployed service lands on an isolated stack network: Traefik can
    # still route inbound (so db.ieeesahrdaya.com works), but there's no egress
    # route — so the fifa-espn-sync cron's $http.send to site.api.espn.com
    # silently failed and matches never auto-synced/settled.
    networks:
      - dokploy-network
    # Force public resolvers. On Swarm overlay networks the embedded resolver
    # (127.0.0.11) sometimes can't resolve EXTERNAL hostnames even when it
    # resolves internal service names — pin explicit upstreams so PB can look
    # up site.api.espn.com.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    # The named /pocketbase volume shadows direct bind mounts below that path.
    # Mount repository sources separately, copy them into the persistent workdir,
    # and restart the PocketBase process whenever hooks or migrations change.
    # PocketBase applies unapplied migrations automatically on `serve`.
    volumes:
      - pocketbase-data:/pocketbase
      - ./pb_hooks:/hooks-src:ro
      - ./pb_migrations:/migrations-src:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu

        fingerprint_sources() {
          {
            find /hooks-src -type f -print 2>/dev/null
            find /migrations-src -type f -print 2>/dev/null
          } \
            | sort \
            | while IFS= read -r file; do cksum "$$file"; done \
            | cksum \
            | awk '{ print $$1 ":" $$2 }'
        }

        sync_runtime_sources() {
          mkdir -p /pocketbase/hooks /pocketbase/migrations
          rm -rf /pocketbase/hooks/* /pocketbase/hooks/.[!.]* /pocketbase/hooks/..?* 2>/dev/null || true
          cp -rf /hooks-src/. /pocketbase/hooks/

          # Remove only files copied from the repository on the previous sync.
          # This prevents deleted/renamed repository migrations from remaining
          # active while preserving PocketBase-generated or manually retained
          # migration history files in the persistent volume.
          managed_manifest=/pocketbase/.repo-managed-migrations
          if [ -f "$$managed_manifest" ]; then
            while IFS= read -r relative_path; do
              [ -n "$$relative_path" ] || continue
              case "$$relative_path" in
                /*|*../*) continue ;;
              esac
              rm -f "/pocketbase/migrations/$$relative_path"
            done < "$$managed_manifest"
          fi

          manifest_tmp="$${managed_manifest}.tmp"
          : > "$$manifest_tmp"
          find /migrations-src -type f -print \
            | sort \
            | while IFS= read -r file; do
                relative_path="$${file#/migrations-src/}"
                destination="/pocketbase/migrations/$$relative_path"
                mkdir -p "$$(dirname "$$destination")"
                cp -f "$$file" "$$destination"
                printf '%s\n' "$$relative_path"
              done > "$$manifest_tmp"
          mv "$$manifest_tmp" "$$managed_manifest"
        }

        stop_pocketbase() {
          if [ -n "$${pb_pid:-}" ] && kill -0 "$$pb_pid" 2>/dev/null; then
            kill -TERM "$$pb_pid" 2>/dev/null || true
            waited=0
            while kill -0 "$$pb_pid" 2>/dev/null && [ "$$waited" -lt 10 ]; do
              sleep 1
              waited=$$((waited + 1))
            done
            if kill -0 "$$pb_pid" 2>/dev/null; then
              echo "[pb-source-watch] PocketBase did not stop gracefully; forcing restart"
              kill -KILL "$$pb_pid" 2>/dev/null || true
            fi
          fi
          if [ -n "$${pb_pid:-}" ]; then
            wait "$$pb_pid" 2>/dev/null || true
          fi
        }

        trap 'stop_pocketbase; exit 0' TERM INT

        sync_runtime_sources
        source_hash="$$(fingerprint_sources)"

        while true; do
          echo "[pb-source-watch] Starting PocketBase"
          /opt/pocketbase/scripts/entrypoint.sh &
          pb_pid=$$!
          restart_for_sources=0

          while kill -0 "$$pb_pid" 2>/dev/null; do
            sleep 2
            next_hash="$$(fingerprint_sources)"
            if [ "$$next_hash" != "$$source_hash" ]; then
              echo "[pb-source-watch] pb_hooks or pb_migrations changed; syncing and restarting PocketBase"
              restart_for_sources=1
              stop_pocketbase
              sync_runtime_sources
              source_hash="$$next_hash"
              break
            fi
          done

          if [ "$$restart_for_sources" -eq 1 ]; then
            continue
          fi

          # PocketBase exited for a reason unrelated to source updates. Exit the
          # wrapper too so Docker's restart: always policy recreates the service.
          wait "$$pb_pid"
          exit $$?
        done
    environment:
      - POCKETBASE_ADMIN_EMAIL=${ADMIN_EMAIL:?err}
      - POCKETBASE_ADMIN_PASSWORD=${ADMIN_PASSWORD:?err}
      - POCKETBASE_ADMIN_UPSERT=true
      - POCKETBASE_PORT_NUMBER=8090
      - POCKETBASE_HOOK_DIR=/pocketbase/hooks
      - POCKETBASE_MIGRATION_DIR=/pocketbase/migrations
      - PAYMENT_WEBHOOK_SECRET=${PAYMENT_WEBHOOK_SECRET:?err}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:?err}
      # Optional: enable settings encryption
      # - POCKETBASE_ENCRYPTION_KEY=${ENCRYPTION_KEY}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/_/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  # Dokploy creates this overlay network; join it as external so we don't
  # spawn a second, isolated one. This is the same network the app service
  # and Traefik are on.
  dokploy-network:
    external: true

volumes:
  pocketbase-data:
